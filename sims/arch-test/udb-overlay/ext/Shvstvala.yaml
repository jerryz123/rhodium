# Corrects UDB 0.1.17's Shvstvala requirement: EBREAK/C.EBREAK are exempt from address reporting.
# SPDX-License-Identifier: Apache-2.0
# RVA23S64 defines Shvstvala by reference to Sstvala, which explicitly excludes software breakpoints.
# https://github.com/riscv/riscv-profiles/blob/main/src/rva23-profile.adoc
requirements:
  allOf:
    - extension:
        name: H
    - param:
        allOf:
          - {name: REPORT_VA_IN_VSTVAL_ON_LOAD_MISALIGNED, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_STORE_AMO_MISALIGNED, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_MISALIGNED, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_LOAD_ACCESS_FAULT, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_STORE_AMO_ACCESS_FAULT, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_ACCESS_FAULT, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_LOAD_PAGE_FAULT, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_STORE_AMO_PAGE_FAULT, equal: true}
          - {name: REPORT_VA_IN_VSTVAL_ON_INSTRUCTION_PAGE_FAULT, equal: true}
          - {name: REPORT_ENCODING_IN_VSTVAL_ON_VIRTUAL_INSTRUCTION, equal: true}
          - {name: REPORT_ENCODING_IN_VSTVAL_ON_ILLEGAL_INSTRUCTION, equal: true}
