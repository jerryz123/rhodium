# Hardens the Rhodium smoke-test leaf inside the pinned Double-Wide OpenFrame wrapper.
# SPDX-License-Identifier: Apache-2.0

DESIGN_NAME: double_wide_openframe_project_wrapper
VERILOG_FILES:
  - dir::../../build/rhodium-top.sv
  - dir::../../verilog/rtl/double_wide_openframe_project_wrapper.v

meta:
  version: 3
  flow: Classic
  substituting_steps:
    Magic.DRC: null
    Checker.MagicDRC: null
    KLayout.DRC: null
    Checker.KLayoutDRC: null
    Checker.YosysUnmappedCells: null

CLOCK_PORT: null
CLOCK_PERIOD: 10
RUN_CTS: false

FP_SIZING: absolute
DIE_AREA: [0, 0, 6754.63, 4766.63]
CORE_AREA: [40, 40, 6714.63, 4726.63]
FP_DEF_TEMPLATE: dir::../../double_wide_openframe/librelane/wrapper/pin_template.def
FP_TEMPLATE_MATCH_MODE: permissive

VDD_NETS: [vccd1, vccd2, vccd, vddio, vdda, vdda1, vdda2]
GND_NETS: [vssd1, vssd2, vssd, vssio, vssa, vssa1, vssa2]
PDN_MULTILAYER: true
PDN_VPITCH: 180
PDN_HPITCH: 180
ERROR_ON_PDN_VIOLATIONS: false

# Keep this extremely sparse smoke design from filling the full 32 mm2 user area.
RUN_TAP_ENDCAP_INSERTION: false
RUN_FILL_INSERTION: false
RUN_LVS: false
RUN_IRDROP_REPORT: false
PL_TARGET_DENSITY_PCT: 5
PDN_CORE_RING: false

MAGIC_EXT_UNIQUE: notopports
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
LINTER_DISABLE_WARNINGS:
  - DECLFILENAME
  - EOFNEWLINE
  - PINCONNECTEMPTY
  - PINMISSING
  - UNUSEDSIGNAL
