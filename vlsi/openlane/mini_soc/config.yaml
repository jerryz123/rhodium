# Synthesizes mapped MiniSoC RTL through Slang with Sky130 SRAM physical views.
# SPDX-License-Identifier: Apache-2.0

DESIGN_NAME: MiniSoC
VERILOG_FILES:
  - dir::../../build/mini-soc/mini-soc.sv
  - dir::../../build/mini-soc/memory-wrappers.sv

# CIRCT emits legal SystemVerilog packed structs that the stock Yosys frontend
# cannot parse. LibreLane's Slang plugin elaborates them directly into Yosys IR.
USE_SLANG: true
SLANG_ARGUMENTS:
  - --keep-hierarchy
SYNTH_HIERARCHY_MODE: keep
# Make timing closure the default objective; DELAY 4 is the measured best viable variant.
SYNTH_STRATEGY: DELAY 4

meta:
  version: 3
  flow: Classic

CLOCK_PORT: clock
CLOCK_PERIOD: 10

MACROS:
  sky130_sram_2kbyte_1rw1r_32x512_8:
    gds:
      - pdk_dir::libs.ref/sky130_sram_macros/gds/sky130_sram_2kbyte_1rw1r_32x512_8.gds
    lef:
      - pdk_dir::libs.ref/sky130_sram_macros/lef/sky130_sram_2kbyte_1rw1r_32x512_8.lef
    vh:
      - pdk_dir::libs.ref/sky130_sram_macros/verilog/sky130_sram_2kbyte_1rw1r_32x512_8.v
    # The installed macro bundle supplies only a nominal TT timing view.
    lib:
      nom_tt_025C_1v80:
        - pdk_dir::libs.ref/sky130_sram_macros/lib/sky130_sram_2kbyte_1rw1r_32x512_8_TT_1p8V_25C.lib
    spice:
      - pdk_dir::libs.ref/sky130_sram_macros/spice/sky130_sram_2kbyte_1rw1r_32x512_8.spice
