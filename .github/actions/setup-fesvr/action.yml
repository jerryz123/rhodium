# Restores and verifies Spike/FESVR host libraries from the patched submodule.
# SPDX-License-Identifier: Apache-2.0

name: Set up Spike and FESVR
description: Cache and build the simulator and host-target libraries from the pinned patched Spike tree.

runs:
  using: composite
  steps:
    - name: Identify cache inputs
      id: inputs
      uses: ./.github/actions/product-input
      with:
        product: fesvr-library
    - name: Cache Spike and FESVR
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tools/fesvr-*
        key: "${{ runner.os }}-${{ runner.arch }}-fesvr-${{ steps.inputs.outputs.key }}"
    - name: Install and verify Spike and FESVR
      shell: bash
      run: make -C sims setup
