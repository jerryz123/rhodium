# Exposes a successful Moon ci-hash task's input digest to workflow cache keys.
# SPDX-License-Identifier: Apache-2.0
name: Identify product inputs
description: Run an explicit Moon cache-key task and read its source digest.
inputs:
  task:
    description: 'Full rhodium: target tagged ci-hash, with no command or dependencies.'
    required: true
outputs:
  key:
    description: Source digest (not a runtime tool or artifact identity).
    value: ${{ steps.digest.outputs.key }}
runs:
  using: composite
  steps:
    - id: digest
      shell: bash
      env:
        HASH_TASK: ${{ inputs.task }}
      run: |
        set -euo pipefail
        moon task "$HASH_TASK" --json | jq -e '
          .command == "noop" and ((.deps // []) | length == 0)
          and ((.tags // []) | index("ci-hash") != null)
        ' >/dev/null
        rm -f .moon/cache/runReport.json
        moon run "$HASH_TASK" --upstream none
        digest=$(jq -er --arg target "$HASH_TASK" '
          if .context.primaryTargets != [$target] then
            error("Moon report does not match the requested hash task")
          else
            [.actions[]
             | select(.node.action == "run-task" and .node.params.target == $target)
             | select(.status == "passed" or .status == "cached")
             | .operations[].meta
             | select(.type == "hash-generation") | .hash] | unique
            | if length == 1 and (.[0] | type == "string" and length > 0) then .[0]
              else error("Moon did not produce one successful task hash") end
          end
        ' .moon/cache/runReport.json)
        echo "key=$digest" >> "$GITHUB_OUTPUT"
