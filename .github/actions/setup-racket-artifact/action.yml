# Restores the exact-commit compiled root for one Rhodium test job.
# SPDX-License-Identifier: Apache-2.0

name: Set up precompiled Rhodium
description: Restore dependencies, install exact project bytecode, and verify its manifest.

inputs:
  racket-version:
    description: Installed Racket version.
    required: true
  rhombus-checksum:
    description: Pinned Rhombus package checksum.
    required: true
  artifact-name:
    description: Exact-commit compiled-root artifact name.
    required: true

runs:
  using: composite
  steps:
    - name: Prepare cached Racket dependencies
      uses: ./.github/actions/setup-racket-cache
      with:
        racket-version: ${{ inputs.racket-version }}
        rhombus-checksum: ${{ inputs.rhombus-checksum }}
    - name: Download compiled root
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/rhodium-compiled
    - name: Verify compiled root
      shell: bash
      env:
        RACKET_VERSION: ${{ inputs.racket-version }}
        RHOMBUS_CHECKSUM: ${{ inputs.rhombus-checksum }}
      run: |
        tools/racket-artifact.sh verify
        echo "RACKET_VERSION=$RACKET_VERSION" >> "$GITHUB_ENV"
        echo "RHOMBUS_CHECKSUM=$RHOMBUS_CHECKSUM" >> "$GITHUB_ENV"
        echo "RHODIUM_PRECOMPILED=1" >> "$GITHUB_ENV"
