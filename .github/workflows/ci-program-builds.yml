# Compiles one shared native ELF family independently of other workload families.
# SPDX-License-Identifier: Apache-2.0

name: CI program builds

on:
  workflow_call:
    inputs:
      matrix:
        description: Compatible build groups for one native workload family.
        required: true
        type: string

permissions:
  contents: read

jobs:
  program-build:
    name: Build ${{ matrix.suite }} / group ${{ strategy.job-index }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize suite sources and record revisions
        id: sources
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          make -C sims "$SUITE-setup"
          case "$SUITE" in
            coremark|coremark_scalar) source=sw/coremark ;;
            embench) source=sw/embench-iot ;;
            bringup) source=sw/bringup-bench ;;
            skl) source=sw/skl ;;
            highway) source=sw/highway ;;
            *) source=sw/riscv-isa-tests ;;
          esac
          echo "revision=$(git rev-parse "HEAD:$source")" >> "$GITHUB_OUTPUT"
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Download generated program targets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/program-targets
      - name: Cache program builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rhodium-program-builds/${{ matrix.build_id }}/${{ matrix.suite }}/build
          key: "${{ runner.os }}-${{ runner.arch }}-program-v2-${{ matrix.build_id }}-${{ steps.sources.outputs.revision }}-${{ hashFiles('tools/install-riscv-*.sh', 'riscv/gnu-toolchain.rhm', 'sw/build/**', 'sw/coremark-riscv-baremetal/**', 'sw/embench-iot-riscv-baremetal/**', 'sw/embench-iot-patches/**', 'sw/bringup-bench-riscv-baremetal/**', 'sw/bringup-bench-patches/**', 'sw/skl-riscv-baremetal/**', 'sw/skl-patches/**', 'sw/highway-riscv-baremetal/**', 'riscv/patched_submodule.py', 'sims/program-test/Makefile.inc', '.github/workflows/ci-program-builds.yml') }}"
      - name: Build and package selected workload ELFs
        env:
          SUITE: ${{ matrix.suite }}
          SOC: ${{ matrix.soc }}
          BUILD_ID: ${{ matrix.build_id }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/program-logs"
          case "$SUITE" in
            coremark|coremark_scalar) build_target="$SUITE-elf" ;;
            *) build_target="$SUITE-elfs" ;;
          esac
          make -C sims "$build_target" SOC="$SOC" \
            PREBUILT_PROGRAM_TARGET="$RUNNER_TEMP/program-targets/$SOC.json" \
            PROGRAM_CONFIG_ROOT="/tmp/rhodium-program-builds/$BUILD_ID" \
            2>&1 | tee "$RUNNER_TEMP/program-logs/$SUITE.log"
          python3 sims/program-test/archive.py \
            --manifest "/tmp/rhodium-program-builds/$BUILD_ID/$SUITE/manifest.json" \
            --archive "$RUNNER_TEMP/program-elfs/$BUILD_ID.tar.gz"
      - name: Publish shared ELF archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: program-elfs-${{ matrix.build_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/program-elfs/${{ matrix.build_id }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: program-build-${{ matrix.build_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/program-logs
            /tmp/rhodium-program-builds/${{ matrix.build_id }}/*/manifest.json
            /tmp/rhodium-program-builds/${{ matrix.build_id }}/*/instruction-report.json
            /tmp/rhodium-program-builds/${{ matrix.build_id }}/*/build.log
          if-no-files-found: warn
          retention-days: 7
