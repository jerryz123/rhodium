# Builds one descriptor-compatible native or harness ELF archive in a fixed slot.
# SPDX-License-Identifier: Apache-2.0

name: CI program builds

on:
  workflow_call:
    inputs:
      build:
        description: Resolved ELF recipe for this fixed slot, or null when unused.
        required: true
        type: string
      kind:
        description: native or harness ELF producer.
        required: true
        type: string
permissions:
  contents: read

jobs:
  program-build:
    name: ${{ format('Build {0} / {1}', fromJSON(inputs.build).suite, fromJSON(inputs.build).soc) }}
    if: ${{ inputs.build != 'null' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Initialize pinned suite sources
        env:
          SUITE: ${{ fromJSON(inputs.build).suite }}
          SETUP: ${{ inputs.kind == 'harness' && 'isa' || fromJSON(inputs.build).suite }}
        run: |
          moon run "rhodium:$SETUP-setup"
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Download generated program targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/program-targets
      - name: Restore portable moon output archives
        id: moon-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .moon/cache/outputs
          key: ${{ runner.os }}-${{ runner.arch }}-moon-2.6.5-${{ fromJSON(inputs.build).build_id }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-moon-2.6.5-${{ fromJSON(inputs.build).build_id }}-
      - name: Build or restore compatible workload archive
        env:
          SOC: ${{ fromJSON(inputs.build).soc }}
          SUITE: ${{ fromJSON(inputs.build).suite }}
          BUILD_ID: ${{ fromJSON(inputs.build).build_id }}
          PROGRAM_TARGETS: ${{ runner.temp }}/program-targets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/program-logs" "$RUNNER_TEMP/program-elfs"
          python3 -m tools.ci.archives check-source "$BUILD_ID"
          python3 -m tools.ci.catalog
          moon run "rhodium:archive--$BUILD_ID" 2>&1 | tee "$RUNNER_TEMP/program-logs/$SUITE.log"
          python3 -m tools.ci.archives verify "$BUILD_ID" --archive ".rhodium-cache/moon/archives/$BUILD_ID.tar.gz"
          cp ".rhodium-cache/moon/archives/$BUILD_ID.tar.gz" "$RUNNER_TEMP/program-elfs/"
      - name: Save trusted ELF outputs
        if: steps.moon-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .moon/cache/outputs
          key: ${{ runner.os }}-${{ runner.arch }}-moon-2.6.5-${{ fromJSON(inputs.build).build_id }}-${{ github.sha }}
      - name: Publish shared ELF archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.kind == 'harness' && 'harness' || 'program' }}-elfs-${{ fromJSON(inputs.build).build_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/program-elfs/${{ fromJSON(inputs.build).build_id }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.kind }}-build-${{ fromJSON(inputs.build).build_id }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/program-logs
            .rhodium-cache/moon/build/${{ fromJSON(inputs.build).build_id }}/*/build.log
            .rhodium-cache/moon/build/${{ fromJSON(inputs.build).build_id }}/*/manifest.json
            .rhodium-cache/moon/build/${{ fromJSON(inputs.build).build_id }}/*/instruction-report.json
          if-no-files-found: warn
          retention-days: 7
