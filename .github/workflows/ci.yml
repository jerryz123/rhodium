# Declares static CI jobs and artifact handoffs, with Moon-selected work and early skips.
# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      scope:
        description: Run full coverage or qualify CoreMark on all four real Simple RVA23 simulators.
        type: choice
        options: [all, coremark]
        default: all
      force_fresh:
        description: Execute software and ACT simulations without reusing prior execution evidence.
        type: boolean
        default: false

permissions:
  contents: read

env:
  RACKET_VERSION: "9.2"
  # Update this pin deliberately when advancing the Rhombus dependency.
  RHOMBUS_CHECKSUM: 17d043235da8abc8d677c63b65034032dbb60b42

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select affected tasks
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      racket_version: ${{ steps.select.outputs.racket_version }}
      rhombus_checksum: ${{ steps.select.outputs.rhombus_checksum }}
    steps:
      - name: Check out Rhodium history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Check selection and receipt contracts
        run: moon run rhodium:ci-contracts --upstream none
      - name: Read affected Moon tasks
        id: select
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$SCOPE" == coremark ]]; then
            selection="$(python3 -m tools.ci.actions --coremark)"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            selection="$(python3 -m tools.ci.actions --all)"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            selection="$(python3 -m tools.ci.actions --revisions \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")"
          else
            selection="$(python3 -m tools.ci.actions --revisions \
              "${{ github.event.before }}" \
              "${{ github.sha }}")"
          fi
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "racket_version=$RACKET_VERSION" >> "$GITHUB_OUTPUT"
          echo "rhombus_checksum=$RHOMBUS_CHECKSUM" >> "$GITHUB_OUTPUT"
          python3 -m json.tool <<< "$selection"

  compile-racket:
    name: Compile Rhodium
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.selection).tasks, 'racket-cache') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ env.RACKET_VERSION }}
      - name: Prepare cached Racket dependencies
        uses: ./.github/actions/setup-racket-cache
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
      - name: Hash bytecode inputs
        id: bytecode-inputs
        uses: ./.github/actions/product-input
        with:
          task: rhodium:hash--bytecode
      - name: Locate bytecode cache
        run: |
          echo "RHODIUM_BYTECODE_INPUTS=${{ steps.bytecode-inputs.outputs.key }}" >> "$GITHUB_ENV"
          echo "RHODIUM_BYTECODE_WORKSPACE_KEY=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Restore completed bytecode
        id: completed-bytecode
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rhodium-compiled
            ${{ runner.temp }}/rhodium-project-cache
          key: ${{ runner.os }}-${{ runner.arch }}-racket-completed-v2-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ env.RHODIUM_BYTECODE_WORKSPACE_KEY }}-${{ env.RHODIUM_BYTECODE_INPUTS }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-racket-completed-v2-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ env.RHODIUM_BYTECODE_WORKSPACE_KEY }}-${{ env.RHODIUM_BYTECODE_INPUTS }}-
      - name: Refresh restored project bytecode
        run: tools/refresh-racket-project-cache.sh "$GITHUB_WORKSPACE" "$PLTCOMPILEDROOTS" "$RUNNER_TEMP/rhodium-project-cache"
      - name: Compile positive CI entrypoints
        run: moon run rhodium:compile-racket --upstream none
      - name: Save completed bytecode
        if: steps.completed-bytecode.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rhodium-compiled
            ${{ runner.temp }}/rhodium-project-cache
          key: ${{ runner.os }}-${{ runner.arch }}-racket-completed-v2-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ env.RHODIUM_BYTECODE_WORKSPACE_KEY }}-${{ env.RHODIUM_BYTECODE_INPUTS }}-${{ github.sha }}
      - name: Publish exact compiled root
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rhodium-bytecode-${{ github.sha }}
          path: ${{ runner.temp }}/rhodium-compiled
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sail:
    name: Build Sail
    needs: select
    if: ${{ contains(fromJSON(needs.select.outputs.selection).tasks, 'build-sail') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Record pinned Sail source
        id: source
        uses: ./.github/actions/product-input
        with:
          task: rhodium:hash--sail
      - name: Install Sail model build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgmp-dev z3 zlib1g-dev
      - name: Restore patched Sail model and compiler
        id: sail-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/sail-compiler-0.20.3
            .tools/sail-riscv-0.16-sail-0.20.3-*
          key: "${{ runner.os }}-${{ runner.arch }}-sail-0.20.3-${{ steps.source.outputs.key }}"
      - name: Build or verify patched Sail model
        run: moon run rhodium:build-sail --upstream none
      - name: Save completed Sail model and compiler
        if: steps.sail-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/sail-compiler-0.20.3
            .tools/sail-riscv-0.16-sail-0.20.3-*
          key: ${{ steps.sail-cache.outputs.cache-primary-key }}
      - name: Package patched Sail model
        run: |
          identity=$(python3 riscv/patched_submodule.py identity --repository . --submodule riscv/sail-riscv --series riscv/sail-riscv-patches/series)
          mkdir -p "$RUNNER_TEMP/sail-riscv"
          tar -czf "$RUNNER_TEMP/sail-riscv/model.tar.gz" -C .tools "sail-riscv-0.16-sail-0.20.3-$identity"
      - name: Build and package shared cosim runtime libraries
        if: ${{ contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'cosim-runtime') }}
        run: |
          identity=$(python3 riscv/patched_submodule.py identity --repository . --submodule riscv/sail-riscv --series riscv/sail-riscv-patches/series)
          runtime=".rhodium-cache/sail-cosim/sail-0.20.3-$identity"
          moon run rhodium:build-cosim-runtime --upstream deep
          python3 sims/cosim/runtime/artifact.py record "$runtime"
          tar -czf "$RUNNER_TEMP/sail-riscv/runtime.tar.gz" "$runtime/artifact.json" "$runtime/link-flags.txt" "$runtime"/*.a
      - name: Publish exact-commit Sail model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sail-riscv-${{ github.sha }}
          path: ${{ runner.temp }}/sail-riscv
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  mapped-smoke:
    name: Mapped Mini smoke
    needs: [select, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && contains(fromJSON(needs.select.outputs.selection).tasks, 'mapped-smoke') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ env.RACKET_VERSION }}
      - uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install mapped build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake clang lld llvm device-tree-compiler zlib1g-dev
      - uses: ./.github/actions/setup-verilator
      - uses: ./.github/actions/setup-circt
      - uses: ./.github/actions/setup-fesvr
      - uses: ./.github/actions/setup-riscv-toolchain
      - name: Qualify the SRAM package and run the mapped simulator
        run: |
          rm -f .moon/cache/runReport.json
          status=0
          moon run rhodium:mapped-smoke --upstream deep || status=$?
          python3 -m tools.ci.receipts rhodium:mapped-smoke || status=1
          exit "$status"
      - uses: ./.github/actions/upload-endpoints
        if: always()

  targets:
    name: Prepare targets
    needs: [select, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'target:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      builds: ${{ steps.targets.outputs.builds }}
      bindings: ${{ steps.targets.outputs.bindings }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ env.RACKET_VERSION }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Generate each selected target once
        id: targets
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
        run: |
          mkdir -p "$RUNNER_TEMP/targets"
          targets=()
          for soc in $(jq -r '.tasks[] | select(startswith("target:")) | ltrimstr("target:")' <<< "$SELECTION"); do
            targets+=("$soc" "$RUNNER_TEMP/targets/$soc.json")
          done
          moon run rhodium:describe-targets --upstream none -- "${targets[@]}"
          PROGRAM_TARGETS="$RUNNER_TEMP/targets" python3 -m tools.ci.archives resolve
      - name: Publish shared target descriptions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/targets
          if-no-files-found: error
          retention-days: 3

  native:
    name: Native checks
    needs: [select, compile-racket]
    if: ${{ always() && !cancelled() && needs.select.result == 'success' && fromJSON(needs.select.outputs.selection).tags['ci-native-check'] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read selected task requirements
        id: work
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
          CATEGORY: ci-native-check
        run: |
          jq -cr --arg category "$CATEGORY" '
            .tags as $tags | ($tags[$category] // []) as $tasks |
            {targets: ($tasks | map("rhodium:" + gsub(":"; "--"))),
             setup: [$tags | to_entries[] | select(.key | startswith("needs-")) |
               select(any(.value[]; . as $task | $tasks | index($task))) | .key | ltrimstr("needs-")]}
          ' <<< "$SELECTION" > "$RUNNER_TEMP/check-selection.json"
          echo "work=$(cat "$RUNNER_TEMP/check-selection.json")" >> "$GITHUB_OUTPUT"
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Install Racket
        if: contains(fromJSON(steps.work.outputs.work).setup, 'bytecode')
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ env.RACKET_VERSION }}
      - name: Restore exact Rhodium bytecode
        if: contains(fromJSON(steps.work.outputs.work).setup, 'bytecode')
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        if: contains(fromJSON(steps.work.outputs.work).setup, 'native-toolchain')
        run: |-
          sudo apt-get update && sudo apt-get install --yes build-essential cmake device-tree-compiler zlib1g-dev
      - name: Install Spike and FESVR
        if: contains(fromJSON(steps.work.outputs.work).setup, 'fesvr')
        uses: ./.github/actions/setup-fesvr
      - name: Install Verilator
        if: contains(fromJSON(steps.work.outputs.work).setup, 'verilator')
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        if: contains(fromJSON(steps.work.outputs.work).setup, 'circt-tool')
        uses: ./.github/actions/setup-circt
      - name: Run selected native checks
        env:
          NEED_VERILATOR: ${{ contains(fromJSON(steps.work.outputs.work).setup, 'verilator') }}
          CHECKS: ${{ join(fromJSON(steps.work.outputs.work).targets, ' ') }}
        run: |
          verilator_root=
          if [[ "$NEED_VERILATOR" == true ]]; then
            verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
            test -n "$verilator_root"
          fi
          read -ra targets <<< "$CHECKS"
          rm -f .moon/cache/runReport.json
          status=0
          VERILATOR_ROOT="$verilator_root" moon exec "${targets[@]}" --upstream deep --on-failure continue --concurrency 1 || status=$?
          python3 -m tools.ci.receipts "${targets[@]}" || status=1
          exit "$status"
      - uses: ./.github/actions/upload-endpoints
        if: always()

  software-checks:
    name: Software adapters
    needs: select
    if: ${{ always() && !cancelled() && needs.select.result == 'success' && fromJSON(needs.select.outputs.selection).tags['ci-adapter'] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read selected task requirements
        id: work
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
          CATEGORY: ci-adapter
        run: |
          jq -cr --arg category "$CATEGORY" '
            .tags as $tags | ($tags[$category] // []) as $tasks |
            {targets: ($tasks | map("rhodium:" + gsub(":"; "--"))),
             setup: [$tags | to_entries[] | select(.key | startswith("needs-")) |
               select(any(.value[]; . as $task | $tasks | index($task))) | .key | ltrimstr("needs-")]}
          ' <<< "$SELECTION" > "$RUNNER_TEMP/check-selection.json"
          echo "work=$(cat "$RUNNER_TEMP/check-selection.json")" >> "$GITHUB_OUTPUT"
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Prepare selected adapter sources
        env:
          SETUP: ${{ join(fromJSON(steps.work.outputs.work).setup, ' ') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential
          read -r -a setup <<< "$SETUP"
          if (( ${#setup[@]} )); then moon run "${setup[@]/#/rhodium:}"; fi
      - name: Run selected software adapters
        env:
          TESTS: ${{ join(fromJSON(steps.work.outputs.work).targets, ' ') }}
        run: |
          read -ra targets <<< "$TESTS"
          rm -f .moon/cache/runReport.json
          status=0
          moon exec "${targets[@]}" --upstream none --on-failure continue --concurrency 1 || status=$?
          python3 -m tools.ci.receipts "${targets[@]}" || status=1
          exit "$status"

      - uses: ./.github/actions/upload-endpoints
        if: always()

  checks:
    name: Checks
    needs: [select, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && fromJSON(needs.select.outputs.selection).tags['ci-check'] != null }}
    strategy:
      fail-fast: false
      matrix:
        pool: [host, rsim, verilog, circt]
        worker: [0, 1]
    uses: ./.github/workflows/ci-checks.yml
    with:
      pool: ${{ matrix.pool }}
      worker: ${{ matrix.worker }}
      targets: ${{ toJSON(fromJSON(needs.select.outputs.selection).tags[format('pool-{0}', matrix.pool)]) }}
      metadata: ${{ toJSON(fromJSON(needs.select.outputs.selection).tags) }}
      racket-version: ${{ needs.select.outputs.racket_version }}
      rhombus-checksum: ${{ needs.select.outputs.rhombus_checksum }}
  program-builds-isa:
    name: program-builds-isa
    needs: [select, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'program:') }}
    strategy:
      fail-fast: false
      matrix:
        soc: [simple-rv2wide-rv32int,simple-rv3wide-rv32int, simple-rv2wide-rv32max, simple-rv3wide-rv32max, simple-rv2wide-rva23, simple-rv3wide-rva23, simple-rv5stage-rv32int, simple-rv5stage-rv32max, simple-rv5stage-rva23, simple-spike-rv32int, simple-spike-rv32max, simple-spike-rva23]
        suite: [isa]
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      build: ${{ toJSON(fromJSON(needs.targets.outputs.builds)[format('native:{0}:{1}', matrix.soc, matrix.suite)]) }}
      kind: native
  program-builds-short:
    name: program-builds-short
    needs: [select, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'program:') }}
    strategy:
      fail-fast: false
      matrix:
        soc: [simple-rv2wide-rva23,simple-rv3wide-rva23, simple-rv5stage-rva23, simple-spike-rva23]
        suite: [benchmark, embench]
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      build: ${{ toJSON(fromJSON(needs.targets.outputs.builds)[format('native:{0}:{1}', matrix.soc, matrix.suite)]) }}
      kind: native
  program-builds-coremark:
    name: program-builds-coremark
    needs: [select, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'program:') }}
    strategy:
      fail-fast: false
      matrix:
        soc: [simple-rv2wide-rva23,simple-rv3wide-rva23, simple-rv5stage-rva23, simple-spike-rva23]
        suite: [coremark, coremark_scalar]
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      build: ${{ toJSON(fromJSON(needs.targets.outputs.builds)[format('native:{0}:{1}', matrix.soc, matrix.suite)]) }}
      kind: native
  program-builds-bringup:
    name: program-builds-bringup
    needs: [select, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'program:') }}
    strategy:
      fail-fast: false
      matrix:
        soc: [simple-rv2wide-rva23,simple-rv3wide-rva23, simple-rv5stage-rva23, simple-spike-rva23]
        suite: [bringup]
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      build: ${{ toJSON(fromJSON(needs.targets.outputs.builds)[format('native:{0}:{1}', matrix.soc, matrix.suite)]) }}
      kind: native
  program-builds-skl:
    name: program-builds-skl
    needs: [select, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'program:') }}
    strategy:
      fail-fast: false
      matrix:
        soc: [simple-rv2wide-rva23,simple-rv3wide-rva23, simple-rv5stage-rva23, simple-spike-rva23]
        suite: [skl]
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      build: ${{ toJSON(fromJSON(needs.targets.outputs.builds)[format('native:{0}:{1}', matrix.soc, matrix.suite)]) }}
      kind: native
  program-builds-highway:
    name: program-builds-highway
    needs: [select, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'program:') }}
    strategy:
      fail-fast: false
      matrix:
        soc: [simple-rv2wide-rva23,simple-rv3wide-rva23, simple-rv5stage-rva23, simple-spike-rva23]
        suite: [highway]
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      build: ${{ toJSON(fromJSON(needs.targets.outputs.builds)[format('native:{0}:{1}', matrix.soc, matrix.suite)]) }}
      kind: native
  harness-isa:
    name: harness-isa
    needs: [select, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && contains(join(fromJSON(needs.select.outputs.selection).tasks, ' '), 'harness:') }}
    strategy:
      fail-fast: false
      matrix:
        soc: [mini-rv2wide-rv32int,mini-rv3wide-rv32int, mini-rv2wide-rv32max, mini-rv3wide-rv32max, mini-rv2wide-rv64imacb, mini-rv3wide-rv64imacb, mini-rv2wide-rv64imafdcb, mini-rv3wide-rv64imafdcb, mini-rv2wide-rva23, mini-rv3wide-rva23, mini-rv5stage-rv32int, mini-rv5stage-rv32max, mini-rv5stage-rv64imacb, mini-rv5stage-rv64imafdcb, mini-rv5stage-rva23, mini-spike-rv32int, mini-spike-rv32max,
