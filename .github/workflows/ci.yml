# Schedules shared CI producers and config-specific consumers without global simulator barriers.
# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RACKET_VERSION: "9.2"
  # Update this pin deliberately when advancing the Rhombus dependency.
  RHOMBUS_CHECKSUM: 17d043235da8abc8d677c63b65034032dbb60b42

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      racket_version: ${{ steps.plan.outputs.racket_version }}
      rhombus_checksum: ${{ steps.plan.outputs.rhombus_checksum }}
    steps:
      - name: Check out Rhodium history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Select affected lanes
        id: plan
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            plan="$(python3 -m tools.ci.plan --all)"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            plan="$(python3 -m tools.ci.plan --revisions \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")"
          else
            plan="$(python3 -m tools.ci.plan --revisions \
              "${{ github.event.before }}" \
              "${{ github.sha }}")"
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "racket_version=$RACKET_VERSION" >> "$GITHUB_OUTPUT"
          echo "rhombus_checksum=$RHOMBUS_CHECKSUM" >> "$GITHUB_OUTPUT"
          python3 -m json.tool <<< "$plan"

  compile-racket:
    name: Compile Rhodium
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).run_compile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ env.RACKET_VERSION }}
      - name: Prepare cached Racket dependencies
        uses: ./.github/actions/setup-racket-cache
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
      - name: Locate bytecode cache
        run: echo "RHODIUM_BYTECODE_WORKSPACE_KEY=$(printf '%s' "$GITHUB_WORKSPACE" | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Restore completed bytecode
        id: completed-bytecode
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rhodium-compiled
            ${{ runner.temp }}/rhodium-project-cache
          key: ${{ runner.os }}-${{ runner.arch }}-racket-completed-v2-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ env.RHODIUM_BYTECODE_WORKSPACE_KEY }}-${{ hashFiles('tools/refresh-racket-project-cache.sh', 'tools/invalidate-racket-build-cache.rkt', 'tools/compile-racket-sources.sh', '.github/actions/setup-racket-cache/action.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-racket-completed-v2-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ env.RHODIUM_BYTECODE_WORKSPACE_KEY }}-${{ hashFiles('tools/refresh-racket-project-cache.sh', 'tools/invalidate-racket-build-cache.rkt', 'tools/compile-racket-sources.sh', '.github/actions/setup-racket-cache/action.yml') }}-
      - name: Refresh restored project bytecode
        run: tools/refresh-racket-project-cache.sh "$GITHUB_WORKSPACE" "$PLTCOMPILEDROOTS" "$RUNNER_TEMP/rhodium-project-cache"
      - name: Compile positive CI entrypoints
        run: tools/compile-racket-sources.sh
      - name: Save completed bytecode
        if: steps.completed-bytecode.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/rhodium-compiled
            ${{ runner.temp }}/rhodium-project-cache
          key: ${{ runner.os }}-${{ runner.arch }}-racket-completed-v2-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ env.RHODIUM_BYTECODE_WORKSPACE_KEY }}-${{ hashFiles('tools/refresh-racket-project-cache.sh', 'tools/invalidate-racket-build-cache.rkt', 'tools/compile-racket-sources.sh', '.github/actions/setup-racket-cache/action.yml') }}-${{ github.sha }}
      - name: Publish exact compiled root
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rhodium-bytecode-${{ github.sha }}
          path: ${{ runner.temp }}/rhodium-compiled
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  sail:
    name: Build Sail
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).run_sail }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Record pinned Sail source
        id: source
        run: echo "revision=$(git rev-parse HEAD:riscv/sail-riscv)" >> "$GITHUB_OUTPUT"
      - name: Install Sail model build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libgmp-dev z3 zlib1g-dev
      - name: Restore patched Sail model and compiler
        id: sail-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/sail-compiler-0.20.3
            .tools/sail-riscv-0.16-sail-0.20.3-*
          key: "${{ runner.os }}-${{ runner.arch }}-sail-0.20.3-${{ steps.source.outputs.revision }}-${{ hashFiles('riscv/sail-riscv-patches/**', 'riscv/patched_submodule.py', 'sims/arch-test/install-sail.sh', 'sims/sail/SailModelConfig.cmake') }}"
      - name: Build or verify patched Sail model
        run: make -C sims arch-test-sail-setup
      - name: Save completed Sail model and compiler
        if: steps.sail-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/sail-compiler-0.20.3
            .tools/sail-riscv-0.16-sail-0.20.3-*
          key: ${{ steps.sail-cache.outputs.cache-primary-key }}
      - name: Package patched Sail model
        run: |
          identity=$(python3 riscv/patched_submodule.py identity --repository . --submodule riscv/sail-riscv --series riscv/sail-riscv-patches/series)
          mkdir -p "$RUNNER_TEMP/sail-riscv"
          tar -czf "$RUNNER_TEMP/sail-riscv/model.tar.gz" -C .tools "sail-riscv-0.16-sail-0.20.3-$identity"
      - name: Build and package shared cosim runtime libraries
        if: fromJSON(needs.plan.outputs.plan).run_cosim
        run: |
          identity=$(python3 riscv/patched_submodule.py identity --repository . --submodule riscv/sail-riscv --series riscv/sail-riscv-patches/series)
          runtime=".rhodium-cache/sail-cosim/sail-0.20.3-$identity"
          make -C sims sail-cosim-build
          python3 sims/cosim/runtime/artifact.py record "$runtime"
          tar -czf "$RUNNER_TEMP/sail-riscv/runtime.tar.gz" "$runtime/artifact.json" "$runtime/link-flags.txt" "$runtime"/*.a
      - name: Publish exact-commit Sail model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sail-riscv-${{ github.sha }}
          path: ${{ runner.temp }}/sail-riscv
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  targets:
    name: Prepare targets
    needs: [plan, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && fromJSON(needs.plan.outputs.plan).run_simulator }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      harness-matrices: ${{ steps.targets.outputs.harness-matrices }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ env.RACKET_VERSION }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Generate each selected target once
        id: targets
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          mkdir -p "$RUNNER_TEMP/targets"
          targets=()
          for soc in $(jq -r '[.simulator_matrix.include[].soc] | unique | .[]' <<< "$PLAN"); do
            targets+=("$soc" "$RUNNER_TEMP/targets/$soc.json")
          done
          tools/run-racket.sh -S "$GITHUB_WORKSPACE" sims/program-test/write-target.rhm --batch "${targets[@]}"
          python3 -m tools.ci.programs --harness --matrix "$(jq -c .simulator_matrix <<< "$PLAN")" \
            --targets "$RUNNER_TEMP/targets" --output "$RUNNER_TEMP/targets/harness-plan.json"
          echo "harness-matrices=$(jq -c '.build.include | group_by(.suite) | map({key: .[0].suite, value: {include: .}}) | from_entries' "$RUNNER_TEMP/targets/harness-plan.json")" >> "$GITHUB_OUTPUT"
      - name: Publish shared target descriptions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/targets
          if-no-files-found: error
          retention-days: 3

  harness-isa:
    name: Harness ELFs / ${{ matrix.suite }} / group ${{ strategy.job-index }}
    needs: [plan, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && fromJSON(needs.plan.outputs.plan).run_simulation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.harness-matrices)['isa'] }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Download shared target descriptions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/targets
      - name: Cache compatible harness builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rhodium-harness-builds/${{ matrix.build_id }}
          key: "${{ runner.os }}-${{ runner.arch }}-harness-${{ matrix.build_id }}-${{ hashFiles('sw/build/**', 'riscv/gnu-toolchain.rhm', 'sims/program-test/Makefile.inc', 'tools/install-riscv-*.sh', '.gitmodules') }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-harness-${{ matrix.build_id }}-${{ hashFiles('sw/build/**', 'riscv/gnu-toolchain.rhm', 'sims/program-test/Makefile.inc', 'tools/install-riscv-*.sh', '.gitmodules') }}-
      - name: Build compatible harness ELFs once
        env:
          SOC: ${{ matrix.soc }}
          SUITE: ${{ matrix.suite }}
          BUILD_ID: ${{ matrix.build_id }}
        run: |
          make -C sims isa-setup
          mkdir -p "$RUNNER_TEMP/harness-elfs"
          output="/tmp/rhodium-harness-builds/$BUILD_ID"
          if [[ "$SUITE" == isa ]]; then
            make -C sims isa-smoke-elfs SOC="$SOC" PROGRAM_CONFIG_ROOT="$output" \
              PREBUILT_PROGRAM_TARGET="$RUNNER_TEMP/targets/$SOC.json"
            manifest="$output/isa-smoke/manifest.json"
          else
            make -C sims tiled-mt-benchmark-elfs SOC="$SOC" PROGRAM_CONFIG_ROOT="$output" \
              PREBUILT_PROGRAM_TARGET="$RUNNER_TEMP/targets/$SOC.json"
            manifest="$output/mt-benchmark/8-harts/manifest.json"
          fi
          python3 sims/program-test/archive.py --manifest "$manifest" \
            --archive "$RUNNER_TEMP/harness-elfs/$BUILD_ID.tar.gz"
      - name: Publish shared harness ELFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-elfs-${{ matrix.build_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/harness-elfs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish harness build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-build-${{ matrix.build_id }}-${{ github.sha }}
          path: |
            /tmp/rhodium-harness-builds/${{ matrix.build_id }}/**/manifest.json
            /tmp/rhodium-harness-builds/${{ matrix.build_id }}/**/build.log
            /tmp/rhodium-harness-builds/${{ matrix.build_id }}/**/instruction-report.json
          if-no-files-found: warn
          retention-days: 7

  harness-benchmark:
    name: Harness ELFs / ${{ matrix.suite }} / group ${{ strategy.job-index }}
    needs: [plan, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && fromJSON(needs.plan.outputs.plan).run_simulation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.harness-matrices)['benchmark'] }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Download shared target descriptions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/targets
      - name: Cache compatible harness builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rhodium-harness-builds/${{ matrix.build_id }}
          key: "${{ runner.os }}-${{ runner.arch }}-harness-${{ matrix.build_id }}-${{ hashFiles('sw/build/**', 'riscv/gnu-toolchain.rhm', 'sims/program-test/Makefile.inc', 'tools/install-riscv-*.sh', '.gitmodules') }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-harness-${{ matrix.build_id }}-${{ hashFiles('sw/build/**', 'riscv/gnu-toolchain.rhm', 'sims/program-test/Makefile.inc', 'tools/install-riscv-*.sh', '.gitmodules') }}-
      - name: Build compatible harness ELFs once
        env:
          SOC: ${{ matrix.soc }}
          SUITE: ${{ matrix.suite }}
          BUILD_ID: ${{ matrix.build_id }}
        run: |
          make -C sims isa-setup
          mkdir -p "$RUNNER_TEMP/harness-elfs"
          output="/tmp/rhodium-harness-builds/$BUILD_ID"
          if [[ "$SUITE" == isa ]]; then
            make -C sims isa-smoke-elfs SOC="$SOC" PROGRAM_CONFIG_ROOT="$output" \
              PREBUILT_PROGRAM_TARGET="$RUNNER_TEMP/targets/$SOC.json"
            manifest="$output/isa-smoke/manifest.json"
          else
            make -C sims tiled-mt-benchmark-elfs SOC="$SOC" PROGRAM_CONFIG_ROOT="$output" \
              PREBUILT_PROGRAM_TARGET="$RUNNER_TEMP/targets/$SOC.json"
            manifest="$output/mt-benchmark/8-harts/manifest.json"
          fi
          python3 sims/program-test/archive.py --manifest "$manifest" \
            --archive "$RUNNER_TEMP/harness-elfs/$BUILD_ID.tar.gz"
      - name: Publish shared harness ELFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-elfs-${{ matrix.build_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/harness-elfs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish harness build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-build-${{ matrix.build_id }}-${{ github.sha }}
          path: |
            /tmp/rhodium-harness-builds/${{ matrix.build_id }}/**/manifest.json
            /tmp/rhodium-harness-builds/${{ matrix.build_id }}/**/build.log
            /tmp/rhodium-harness-builds/${{ matrix.build_id }}/**/instruction-report.json
          if-no-files-found: warn
          retention-days: 7

  native:
    name: Native checks
    needs: [plan, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && fromJSON(needs.plan.outputs.plan).run_native }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ env.RACKET_VERSION }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake device-tree-compiler zlib1g-dev
      - name: Install Spike and FESVR
        uses: ./.github/actions/setup-fesvr
      - name: Install Verilator
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        if: fromJSON(needs.plan.outputs.plan).run_spike_tests
        uses: ./.github/actions/setup-circt
      - name: Test native adapters once
        run: |
          verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
          test -n "$verilator_root"
          make -C sims dpi-compile-check transport-test arch-test-adapter-test program-test-adapter-test \
            cosim-hooks-test simulation-runtime-test branch-prediction-test VERILATOR_ROOT="$verilator_root"
      - name: Test Spike DPI integration once
        if: fromJSON(needs.plan.outputs.plan).run_spike_tests
        run: |
          verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
          make -C sims spike-core-test spike-dpi-test spike-dpi-abi-check VERILATOR_ROOT="$verilator_root"

  checks:
    name: Checks
    needs: [plan, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && fromJSON(needs.plan.outputs.plan).run_checks }}
    uses: ./.github/workflows/ci-checks.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).checks_matrix) }}
      racket-version: ${{ needs.plan.outputs.racket_version }}
      rhombus-checksum: ${{ needs.plan.outputs.rhombus_checksum }}

  program-plan:
    name: Plan software builds
    needs: [plan, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && fromJSON(needs.plan.outputs.plan).run_program_native }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build-matrices: ${{ steps.plan.outputs.build-matrices }}
      run-matrices: ${{ steps.plan.outputs.run-matrices }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download shared target descriptions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/program-targets
      - name: Group compatible program builds
        id: plan
        env:
          PROGRAM_MATRIX: ${{ toJSON(fromJSON(needs.plan.outputs.plan).program_matrix) }}
        run: |
          python3 -m tools.ci.programs --group-runs --matrix "$PROGRAM_MATRIX" \
            --targets "$RUNNER_TEMP/program-targets" --output "$RUNNER_TEMP/program-plan.json"
          echo "build-matrices=$(jq -c .build_groups "$RUNNER_TEMP/program-plan.json")" >> "$GITHUB_OUTPUT"
          echo "run-matrices=$(jq -c .run_groups "$RUNNER_TEMP/program-plan.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/program-plan.json"

  program-builds-isa:
    name: Software builds / isa
    needs: [plan, program-plan]
    if: ${{ always() && !cancelled() && needs.program-plan.result == 'success' && contains(fromJSON(needs.plan.outputs.plan).program_build_groups, 'isa') }}
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.program-plan.outputs.build-matrices)['isa']) }}

  program-builds-short:
    name: Software builds / short
    needs: [plan, program-plan]
    if: ${{ always() && !cancelled() && needs.program-plan.result == 'success' && contains(fromJSON(needs.plan.outputs.plan).program_build_groups, 'short') }}
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.program-plan.outputs.build-matrices)['short']) }}

  program-builds-bringup:
    name: Software builds / bringup
    needs: [plan, program-plan]
    if: ${{ always() && !cancelled() && needs.program-plan.result == 'success' && contains(fromJSON(needs.plan.outputs.plan).program_build_groups, 'bringup') }}
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.program-plan.outputs.build-matrices)['bringup']) }}

  program-builds-skl:
    name: Software builds / skl
    needs: [plan, program-plan]
    if: ${{ always() && !cancelled() && needs.program-plan.result == 'success' && contains(fromJSON(needs.plan.outputs.plan).program_build_groups, 'skl') }}
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.program-plan.outputs.build-matrices)['skl']) }}

  program-builds-highway:
    name: Software builds / highway
    needs: [plan, program-plan]
    if: ${{ always() && !cancelled() && needs.program-plan.result == 'success' && contains(fromJSON(needs.plan.outputs.plan).program_build_groups, 'highway') }}
    uses: ./.github/workflows/ci-program-builds.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.program-plan.outputs.build-matrices)['highway']) }}

  platform-plan:
    name: Plan platform builds
    needs: [plan, targets]
    if: ${{ always() && !cancelled() && needs.targets.result == 'success' && fromJSON(needs.plan.outputs.plan).run_simulation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      build-matrices: ${{ steps.plan.outputs.build-matrices }}
      run-matrices: ${{ steps.plan.outputs.run-matrices }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download shared target descriptions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/platform-targets
      - name: Group compatible platform builds
        id: plan
        run: |
          matrix=$(python3 -c 'import json; from tools.ci.policy import platform_configs; print(json.dumps({"include": platform_configs()}))')
          python3 -m tools.ci.programs --matrix "$matrix" \
            --targets "$RUNNER_TEMP/platform-targets" \
            --output "$RUNNER_TEMP/platform-plan.json"
          echo "build-matrices=$(jq -c '.build.include | group_by(.suite) | map({key: .[0].suite, value: {include: .}}) | from_entries' "$RUNNER_TEMP/platform-plan.json")" >> "$GITHUB_OUTPUT"
          echo "run-matrices=$(jq -c '.run.include | group_by(.soc) | map({key: .[0].soc, value: {include: .}}) | from_entries' "$RUNNER_TEMP/platform-plan.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/platform-plan.json"
