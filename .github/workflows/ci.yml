# Orchestrates dependency-aware Rhodium CI through focused reusable workflows.
# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RACKET_VERSION: "9.2"
  # Update this pin deliberately when advancing the Rhombus dependency.
  RHOMBUS_CHECKSUM: 17d043235da8abc8d677c63b65034032dbb60b42

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan affected CI lanes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      racket_version: ${{ steps.plan.outputs.racket_version }}
      rhombus_checksum: ${{ steps.plan.outputs.rhombus_checksum }}
    steps:
      - name: Check out Rhodium history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test CI policy
        run: python3 -m unittest tools.ci.test_plan
      - name: Select affected lanes
        id: plan
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            plan="$(python3 -m tools.ci.plan --all)"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            plan="$(python3 -m tools.ci.plan --revisions \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}")"
          else
            plan="$(python3 -m tools.ci.plan --revisions \
              "${{ github.event.before }}" \
              "${{ github.sha }}")"
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "racket_version=$RACKET_VERSION" >> "$GITHUB_OUTPUT"
          echo "rhombus_checksum=$RHOMBUS_CHECKSUM" >> "$GITHUB_OUTPUT"
          python3 -m json.tool <<< "$plan"

  compile-racket:
    name: Compile Rhodium once
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).run_compile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ env.RACKET_VERSION }}
      - name: Prepare cached Racket dependencies
        uses: ./.github/actions/setup-racket-cache
        with:
          racket-version: ${{ env.RACKET_VERSION }}
          rhombus-checksum: ${{ env.RHOMBUS_CHECKSUM }}
      - name: Locate checkout bytecode
        run: echo "RHODIUM_PROJECT_BYTECODE_PATH=$RUNNER_TEMP/rhodium-compiled/${GITHUB_WORKSPACE#/}" >> "$GITHUB_ENV"
      - name: Restore project bytecode
        id: project-bytecode
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.RHODIUM_PROJECT_BYTECODE_PATH }}
            ${{ runner.temp }}/rhodium-project-cache
          key: ${{ runner.os }}-${{ runner.arch }}-racket-project-v1-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ hashFiles('tools/refresh-racket-project-cache.sh', 'tools/invalidate-racket-build-cache.rkt') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-racket-project-v1-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ hashFiles('tools/refresh-racket-project-cache.sh', 'tools/invalidate-racket-build-cache.rkt') }}-
      - name: Refresh restored project bytecode
        run: tools/refresh-racket-project-cache.sh "$GITHUB_WORKSPACE" "$PLTCOMPILEDROOTS" "$RUNNER_TEMP/rhodium-project-cache"
      - name: Compile positive CI entrypoints
        run: tools/compile-racket-sources.sh
      - name: Save project bytecode
        if: steps.project-bytecode.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.RHODIUM_PROJECT_BYTECODE_PATH }}
            ${{ runner.temp }}/rhodium-project-cache
          key: ${{ runner.os }}-${{ runner.arch }}-racket-project-v1-${{ env.RACKET_VERSION }}-rhombus-${{ env.RHOMBUS_CHECKSUM }}-${{ hashFiles('tools/refresh-racket-project-cache.sh', 'tools/invalidate-racket-build-cache.rkt') }}-${{ github.sha }}
      - name: Publish exact compiled root
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rhodium-bytecode-${{ github.sha }}
          path: ${{ runner.temp }}/rhodium-compiled
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  checks:
    name: Host, example, and CIRCT checks
    needs: [plan, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && fromJSON(needs.plan.outputs.plan).run_checks }}
    uses: ./.github/workflows/ci-checks.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).checks_matrix) }}
      racket-version: ${{ needs.plan.outputs.racket_version }}
      rhombus-checksum: ${{ needs.plan.outputs.rhombus_checksum }}

  simulator:
    name: Shared simulators
    needs: [plan, compile-racket]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && fromJSON(needs.plan.outputs.plan).run_simulator }}
    uses: ./.github/workflows/ci-simulator.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).simulator_matrix) }}
      racket-version: ${{ needs.plan.outputs.racket_version }}
      rhombus-checksum: ${{ needs.plan.outputs.rhombus_checksum }}

  simulation:
    name: Simulation
    needs: [plan, compile-racket, simulator]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && needs.simulator.result == 'success' && fromJSON(needs.plan.outputs.plan).run_simulation }}
    uses: ./.github/workflows/ci-simulation.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).simulation_matrix) }}
      racket-version: ${{ needs.plan.outputs.racket_version }}
      rhombus-checksum: ${{ needs.plan.outputs.rhombus_checksum }}

  software:
    name: Bare-metal software
    needs: [plan, compile-racket, simulator]
    if: ${{ always() && !cancelled() && needs.compile-racket.result == 'success' && needs.simulator.result == 'success' && (fromJSON(needs.plan.outputs.plan).run_program_native || fromJSON(needs.plan.outputs.plan).run_program_arch) }}
    uses: ./.github/workflows/ci-software.yml
    with:
      run-native: ${{ fromJSON(needs.plan.outputs.plan).run_program_native }}
      native-matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).program_matrix) }}
      run-arch: ${{ fromJSON(needs.plan.outputs.plan).run_program_arch }}
      racket-version: ${{ needs.plan.outputs.racket_version }}
      rhombus-checksum: ${{ needs.plan.outputs.rhombus_checksum }}

  gate:
    name: CI
    needs: [plan, compile-racket, checks, simulator, simulation, software]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify selected workflows passed
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          COMPILE_RESULT: ${{ needs.compile-racket.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SIMULATOR_RESULT: ${{ needs.simulator.result }}
          SIMULATION_RESULT: ${{ needs.simulation.result }}
          SOFTWARE_RESULT: ${{ needs.software.result }}
        run: |
          test "${{ needs.plan.result }}" = success
          python3 -m tools.ci.gate "$PLAN" \
            "compile=$COMPILE_RESULT" \
            "checks=$CHECKS_RESULT" \
            "simulator=$SIMULATOR_RESULT" \
            "simulation=$SIMULATION_RESULT" \
            "software=$SOFTWARE_RESULT"
