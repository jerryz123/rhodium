# Runs selected checks in compatible groups with shared setup and per-target logs.
# SPDX-License-Identifier: Apache-2.0

name: CI checks

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON include matrix produced by the CI planner.
        required: true
        type: string
      racket-version:
        description: Installed Racket version.
        required: true
        type: string
      rhombus-checksum:
        description: Pinned Rhombus package checksum.
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install device-tree compiler
        if: matrix.dtc
        run: |
          sudo apt-get update
          sudo apt-get install --yes device-tree-compiler
      - name: Install Verilator
        if: matrix.verilator
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        if: matrix.circt
        uses: ./.github/actions/setup-circt
      - name: Run selected checks
        env:
          CHECK_TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -o pipefail
          test -n "$CHECK_TARGETS"
          mkdir -p "$RUNNER_TEMP/check-logs"
          status=0
          for target in $CHECK_TARGETS; do
            echo "::group::$target"
            make "$target" 2>&1 | tee "$RUNNER_TEMP/check-logs/$target.log" || status=1
            echo '::endgroup::'
          done
          exit "$status"
      - name: Publish check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ matrix.key }}-${{ github.sha }}
          path: ${{ runner.temp }}/check-logs
          if-no-files-found: warn
          retention-days: 7
