# Generates one config's shared ACT payload independently of simulator builds.
# SPDX-License-Identifier: Apache-2.0

name: CI ACT build

on:
  workflow_call:
    inputs:
      config:
        description: One selected architectural test config.
        required: true
        type: string
      racket-version:
        description: Installed Racket version.
        required: true
        type: string
      rhombus-checksum:
        description: Pinned Rhombus checksum.
        required: true
        type: string

permissions:
  contents: read

jobs:
  arch-build:
    name: Generate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize pinned ACT sources
        id: sources
        run: |
          git submodule update --init sw/riscv-arch-test
          echo "revision=$(git rev-parse HEAD:sw/riscv-arch-test)" >> "$GITHUB_OUTPUT"
          echo "sail_revision=$(git rev-parse HEAD:riscv/sail-riscv)" >> "$GITHUB_OUTPUT"
      - name: Download exact-commit Sail model
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sail-riscv-${{ github.sha }}
          path: ${{ runner.temp }}/sail-riscv
      - name: Install patched Sail model
        run: |
          mkdir -p .tools
          tar -xzf "$RUNNER_TEMP/sail-riscv/model.tar.gz" -C .tools
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install ACT native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential ruby-dev bundler libgmp-dev libyaml-dev zlib1g-dev
      - name: Cache ACT dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/act-venv
            .tools/act-bundle
            .tools/act-cache
            .tools/act-data
          key: "${{ runner.os }}-${{ runner.arch }}-act-${{ steps.sources.outputs.revision }}-${{ hashFiles('sims/arch-test/setup.sh') }}"
      - name: Set up ACT and generate platform configuration
        id: act-config
        run: |
          make -C sims arch-test-setup arch-test-config ACT_CONFIGURATION=${{ fromJSON(inputs.config).configuration }}
          echo "digest=$(sha256sum /tmp/rhodium-arch-test/configs/${{ fromJSON(inputs.config).configuration }}/* | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          riscv64-unknown-elf-gcc --version > "$RUNNER_TEMP/act-tools.txt"
          riscv64-unknown-elf-ld --version >> "$RUNNER_TEMP/act-tools.txt"
          riscv64-unknown-elf-objdump --version >> "$RUNNER_TEMP/act-tools.txt"
          cat .tools/riscv-toolchain/.archive-sha256 >> "$RUNNER_TEMP/act-tools.txt"
          .tools/act-venv/bin/python --version >> "$RUNNER_TEMP/act-tools.txt"
          .tools/act-venv/bin/python -m pip freeze >> "$RUNNER_TEMP/act-tools.txt"
          ruby --version >> "$RUNNER_TEMP/act-tools.txt"
          bundle --version >> "$RUNNER_TEMP/act-tools.txt"
          BUNDLE_GEMFILE="$PWD/sw/riscv-arch-test/framework/src/act/data/Gemfile" BUNDLE_PATH="$PWD/.tools/act-bundle" bundle list >> "$RUNNER_TEMP/act-tools.txt"
          echo "tools=$(sha256sum "$RUNNER_TEMP/act-tools.txt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Identify complete ACT payload inputs
        id: act-inputs
        env:
          ACT_INPUT_KEY: "${{ runner.os }}-${{ runner.arch }}-act-elfs-v1-fast1-all-${{ steps.sources.outputs.revision }}-${{ steps.sources.outputs.sail_revision }}-${{ steps.act-config.outputs.digest }}-${{ steps.act-config.outputs.tools }}-${{ hashFiles('tools/install-riscv-*.sh', 'sims/arch-test/**', 'sims/sail/**', 'sw/riscv-arch-test-patches/**', 'riscv/sail-riscv-patches/**', 'riscv/patched_submodule.py', '!**/__pycache__/**', '!**/compiled/**') }}"
        run: echo "key=$ACT_INPUT_KEY" >> "$GITHUB_OUTPUT"
      - name: Restore complete ACT payload
        id: act-payload
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/act/elfs.tar.gz
            ${{ runner.temp }}/act/elfs.sha256
            ${{ runner.temp }}/act/configuration.json
            ${{ runner.temp }}/act/inventory.json
          key: ${{ steps.act-inputs.outputs.key }}
      - name: Verify cached ACT payload
        if: steps.act-payload.outputs.cache-hit == 'true'
        run: |
          python3 sims/arch-test/payload.py verify --bundle "$RUNNER_TEMP/act" \
            --configuration /tmp/rhodium-arch-test/configs/${{ fromJSON(inputs.config).configuration }}/configuration.json \
            --identity '${{ steps.act-inputs.outputs.key }}'
      - name: Check GEILEN-dependent Sail CSR aliases
        if: fromJSON(inputs.config).configuration == 'simple-rv5stage-rva23'
        run: make -C sims arch-test-sail-test ACT_CONFIGURATION=${{ fromJSON(inputs.config).configuration }}
      - name: Cache ACT reference outputs
        if: steps.act-payload.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/rhodium-arch-test/work/**/build
            /tmp/rhodium-arch-test/work/**/.act_build_cache.json
          key: "${{ runner.os }}-${{ runner.arch }}-act-reference-${{ steps.sources.outputs.revision }}-${{ steps.sources.outputs.sail_revision }}-${{ steps.act-config.outputs.digest }}-${{ hashFiles('tools/install-riscv-*.sh', 'sims/arch-test/**', 'sims/sail/**', 'sw/riscv-arch-test-patches/**', 'riscv/sail-riscv-patches/**', 'riscv/patched_submodule.py') }}"
      - name: Generate and package every selected ELF
        if: steps.act-payload.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/act"
          make -C sims arch-test-elfs ACT_CONFIGURATION=${{ fromJSON(inputs.config).configuration }} ACT_FAST=1 2>&1 | tee "$RUNNER_TEMP/act/generation.log"
          python3 sims/arch-test/payload.py package --bundle "$RUNNER_TEMP/act" \
            --elf-dir /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/elfs \
            --configuration /tmp/rhodium-arch-test/configs/${{ fromJSON(inputs.config).configuration }}/configuration.json \
            --identity '${{ steps.act-inputs.outputs.key }}'
      - name: Save complete successful ACT payload
        if: steps.act-payload.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/act/elfs.tar.gz
            ${{ runner.temp }}/act/elfs.sha256
            ${{ runner.temp }}/act/configuration.json
            ${{ runner.temp }}/act/inventory.json
          key: ${{ steps.act-inputs.outputs.key }}
      - name: Publish exact-commit ACT payloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.config).configuration }}-arch-elfs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/act/elfs.tar.gz
            ${{ runner.temp }}/act/elfs.sha256
            ${{ runner.temp }}/act/configuration.json
            ${{ runner.temp }}/act/inventory.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Publish generation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.config).configuration }}-arch-generation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/act/generation.log
            /tmp/rhodium-arch-test/configs
            /tmp/rhodium-arch-test/work/**/*.log
          if-no-files-found: warn
          retention-days: 7
