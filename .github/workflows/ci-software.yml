# Runs grouped native suites against one ready simulator and shared ELF archives.
# SPDX-License-Identifier: Apache-2.0

name: CI software

on:
  workflow_call:
    inputs:
      config:
        description: Fixed SoC, suite candidates, and shard.
        required: true
        type: string
      selection:
        description: Selected Moon graph.
        required: true
        type: string
      bindings:
        description: Resolved ELF identities.
        required: true
        type: string
permissions:
  contents: read

jobs:
  programs:
    name: ${{ format('Run {0} / shard {1}', fromJSON(inputs.config).group, fromJSON(inputs.config).shard) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RHODIUM_FORCE_FRESH_EXECUTION: ${{ github.event.inputs.force_fresh == 'true' && '1' || '0' }}
    steps:
      - name: Select this fixed execution slot
        id: work
        env:
          CONFIG: ${{ inputs.config }}
          SELECTION: ${{ inputs.selection }}
          BINDINGS: ${{ inputs.bindings }}
        run: |
          config=$(jq -c --argjson selected "$SELECTION" --argjson bindings "$BINDINGS" '
            . as $config |
            .suites |= [ .[] | . as $suite |
              select($selected.tasks | index("program:" + $config.soc + ":" + $suite + ":shard-" + ($config.shard|tostring))) |
              {suite: $suite, build_id: $bindings["native:" + $config.soc + ":" + $suite]} |
              if .build_id == null then error("selected workload has no ELF binding") else . end] |
            .suites |= sort_by(.suite) |
            if .group == "short" and (.suites | length) == 1 then .group = .suites[0].suite else . end |
            .build_pattern = ([.suites[].build_id] | unique | if length == 1 then .[0] else "{" + join(",") + "}" end)
          ' <<< "$CONFIG")
          echo "config=$config" >> "$GITHUB_OUTPUT"
          echo "active=$(jq '.suites | length > 0' <<< "$config")" >> "$GITHUB_OUTPUT"
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Locate execution evidence
        run: |
          echo "RHODIUM_EXECUTION_CACHE=$RUNNER_TEMP/execution-evidence" >> "$GITHUB_ENV"
          echo "RHODIUM_EXECUTION_CONTEXT=$RUNNER_TEMP/execution-context.json" >> "$GITHUB_ENV"
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Install simulator runtime dependencies
        # Execution evidence is restored only after dependencies and inputs are verified.
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake device-tree-compiler zlib1g-dev
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Restore exact Spike runtime libraries
        if: ${{ (contains(fromJSON(steps.work.outputs.config).soc, '-spike-')) && steps.work.outputs.active == 'true' }}
        uses: ./.github/actions/setup-fesvr
      - name: Install Sail cosim runtime dependency
        if: ${{ (fromJSON(steps.work.outputs.config).cosim) && steps.work.outputs.active == 'true' }}
        run: sudo apt-get install --yes libgmp10
      - name: Download exact simulator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ fromJSON(steps.work.outputs.config).soc }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ fromJSON(steps.work.outputs.config).soc }}
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Download shared workload ELFs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: program-elfs-${{ fromJSON(steps.work.outputs.config).build_pattern }}-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/program-elfs
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Download resolved workload requests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/resolved-targets
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Activate the resolved moon catalog
        run: |
          echo "PROGRAM_TARGETS=$RUNNER_TEMP/resolved-targets" >> "$GITHUB_ENV"
          PROGRAM_TARGETS="$RUNNER_TEMP/resolved-targets" python3 -m tools.ci.catalog
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Verify exact simulator
        env:
          SOC: ${{ fromJSON(steps.work.outputs.config).soc }}
        run: |
          chmod +x "$RUNNER_TEMP/$SOC/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "$RUNNER_TEMP/$SOC/VTestDriver" --soc "$SOC" \
            --backend "${{ fromJSON(steps.work.outputs.config).backend }}" --variant "${{ fromJSON(steps.work.outputs.config).variant }}"
          ldd "$RUNNER_TEMP/$SOC/VTestDriver"
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Bind selected suites
        id: bind
        env:
          SUITES: ${{ toJSON(fromJSON(steps.work.outputs.config).suites) }}
          SOC: ${{ fromJSON(steps.work.outputs.config).soc }}
        run: |
          mkdir -p "$RUNNER_TEMP/program-logs"
          jq -er '.[] | [.suite, .build_id] | @tsv' <<< "$SUITES" > "$RUNNER_TEMP/selected-suites.tsv"
          status=0
          while IFS=$'\t' read -r suite build_id; do
            suite_dir="/tmp/rhodium-program-tests/$SOC/$suite"
            archive="$RUNNER_TEMP/program-elfs/$build_id.tar.gz"
            mkdir -p "$suite_dir"
            if ! python3 -m tools.ci.archives bind "$build_id" --soc "$SOC" --archive "$archive" \
                 --output "$suite_dir/run-manifest.json"; then
              status=1
              echo "::error::Could not prepare $suite for $SOC"
            fi
          done < "$RUNNER_TEMP/selected-suites.tsv"
          echo "failed=$status" >> "$GITHUB_OUTPUT"
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Identify execution inputs
        id: execution-identity
        if: ${{ (steps.bind.outputs.failed == '0') && steps.work.outputs.active == 'true' }}
        env:
          SOC: ${{ fromJSON(steps.work.outputs.config).soc }}
          SELECTION: ${{ steps.work.outputs.config }}
        run: |
          manifests=()
          while IFS=$'\t' read -r suite _build_id; do
            manifests+=(--manifest "/tmp/rhodium-program-tests/$SOC/$suite/run-manifest.json")
          done < "$RUNNER_TEMP/selected-suites.tsv"
          python3 sims/program-test/execution.py prepare --kind native \
            --simulator "$RUNNER_TEMP/$SOC/VTestDriver" --metadata "$RUNNER_TEMP/$SOC/VTestDriver.json" \
            "${manifests[@]}" --selection "$SELECTION" \
            --shard-index ${{ fromJSON(steps.work.outputs.config).shard }} --shard-count ${{ fromJSON(steps.work.outputs.config).shard_count }} \
            --output "$RHODIUM_EXECUTION_CONTEXT" >> "$GITHUB_OUTPUT"
      - name: Restore exact execution evidence
        id: evidence-cache
        if: ${{ (steps.execution-identity.outputs.key != '' && env.RHODIUM_FORCE_FRESH_EXECUTION != '1') && steps.work.outputs.active == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RHODIUM_EXECUTION_CACHE }}
          key: execution-${{ steps.execution-identity.outputs.key }}
      - name: Run or recheck selected suites
        env:
          RTL_BACKEND: ${{ fromJSON(steps.work.outputs.config).backend }}
          COSIM: ${{ fromJSON(steps.work.outputs.config).cosim && '1' || '0' }}
          STATS: ${{ fromJSON(steps.work.outputs.config).stats && '1' || '0' }}
          SOC: ${{ fromJSON(steps.work.outputs.config).soc }}
          BIND_FAILED: ${{ steps.bind.outputs.failed }}
        run: |
          set -o pipefail
          status="$BIND_FAILED"
          while IFS=$'\t' read -r suite _build_id; do
            echo "::group::$suite"
            suite_dir="/tmp/rhodium-program-tests/$SOC/$suite"
            if [[ ! -f "$suite_dir/run-manifest.json" ]]; then
              status=1
              echo '::endgroup::'
              continue
            fi
            target="rhodium:program--$SOC--$suite--shard-${{ fromJSON(steps.work.outputs.config).shard }}"
            rm -f .moon/cache/runReport.json
            PREBUILT_SIMULATOR="$RUNNER_TEMP/$SOC/VTestDriver" \
              PROGRAM_MANIFEST="$suite_dir/run-manifest.json" PROGRAM_JOBS=2 \
              moon run "$target" --upstream none \
              2>&1 | tee "$RUNNER_TEMP/program-logs/$suite.log" || status=1
            python3 -m tools.ci.receipts "$target" || status=1
            echo '::endgroup::'
          done < "$RUNNER_TEMP/selected-suites.tsv"
          exit "$status"
        if: ${{ (success()) && steps.work.outputs.active == 'true' }}
      - name: Check complete functional evidence
        id: evidence-ready
        if: ${{ (always() && !cancelled() && steps.execution-identity.outputs.key != '') && steps.work.outputs.active == 'true' }}
        run: |
          python3 sims/program-test/execution.py ready --context "$RHODIUM_EXECUTION_CONTEXT" \
            --directory "$RHODIUM_EXECUTION_CACHE" >> "$GITHUB_OUTPUT"
      - name: Save successful execution evidence
        if: ${{ (always() && !cancelled() && steps.evidence-ready.outputs.ready == 'true' && steps.evidence-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch')) && steps.work.outputs.active == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RHODIUM_EXECUTION_CACHE }}
          key: execution-${{ steps.execution-identity.outputs.key }}

      - name: Summarize whole-ELF cycles
        if: ${{ (always() && fromJSON(steps.work.outputs.config).group != 'isa') && steps.work.outputs.active == 'true' }}
        run: |
          if [[ -d /tmp/rhodium-program-tests ]]; then
            python3 sims/program-test/performance.py summary --results /tmp/rhodium-program-tests >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish importable performance measurements
        if: ${{ (always() && fromJSON(steps.work.outputs.config).group != 'isa') && steps.work.outputs.active == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ fromJSON(steps.work.outputs.config).soc }}-${{ fromJSON(steps.work.outputs.config).group }}-${{ fromJSON(steps.work.outputs.config).shard }}-${{ github.sha }}
          path: /tmp/rhodium-program-tests/*/*/results/**/performance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish workload results and diagnostics
        if: ${{ (always()) && steps.work.outputs.active == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(steps.work.outputs.config).soc }}-${{ fromJSON(steps.work.outputs.config).group }}-${{ fromJSON(steps.work.outputs.config).shard }}-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/program-logs
            /tmp/rhodium-program-tests/*/*/manifest.json
            /tmp/rhodium-program-tests/*/*/run-manifest.json
            /tmp/rhodium-program-tests/*/*/instruction-report.json
            /tmp/rhodium-program-tests/*/*/build.log
            /tmp/rhodium-program-tests/*/*/results
            ${{ runner.temp }}/program-elfs
          if-no-files-found: warn
          retention-days: 7

      - uses: ./.github/actions/upload-endpoints
        if: ${{ (always()) && steps.work.outputs.active == 'true' }}
