# Runs a config's ACT shards when its simulator and payload are ready.
# SPDX-License-Identifier: Apache-2.0

name: CI ACT

on:
  workflow_call:
    inputs:
      config:
        description: Fixed architectural execution shard.
        required: true
        type: string
      selection:
        description: Selected Moon graph.
        required: true
        type: string
permissions:
  contents: read

jobs:
  arch:
    name: Run / shard ${{ fromJSON(inputs.config).shard }}
    if: ${{ contains(fromJSON(inputs.selection).tasks, format('act:{0}:shard-{1}', fromJSON(inputs.config).configuration, fromJSON(inputs.config).shard)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RHODIUM_FORCE_FRESH_EXECUTION: ${{ github.event.inputs.force_fresh == 'true' && '1' || '0' }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Locate execution evidence
        run: |
          echo "RHODIUM_EXECUTION_CACHE=$RUNNER_TEMP/execution-evidence" >> "$GITHUB_ENV"
          echo "RHODIUM_EXECUTION_CONTEXT=$RUNNER_TEMP/execution-context.json" >> "$GITHUB_ENV"
      - name: Initialize upstream runner
        run: git submodule update --init sw/riscv-arch-test
      - name: Install Spike runtime dependencies
        if: fromJSON(inputs.config).core == 'spike'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential device-tree-compiler zlib1g-dev
      - name: Restore pinned Spike runtime libraries
        if: fromJSON(inputs.config).core == 'spike'
        uses: ./.github/actions/setup-fesvr
      - name: Install Sail cosim runtime dependency
        if: fromJSON(inputs.config).cosim
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgmp10
      - name: Download exact simulator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ fromJSON(inputs.config).configuration }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ fromJSON(inputs.config).configuration }}
      - name: Download exact ACT payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ fromJSON(inputs.config).configuration }}-arch-elfs-${{ github.sha }}
          path: ${{ runner.temp }}/act
      - name: Verify and unpack shared artifacts
        run: |
          chmod +x "$RUNNER_TEMP/${{ fromJSON(inputs.config).configuration }}/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "$RUNNER_TEMP/${{ fromJSON(inputs.config).configuration }}/VTestDriver" --soc ${{ fromJSON(inputs.config).configuration }} \
            --backend "${{ fromJSON(inputs.config).backend }}" --variant "${{ fromJSON(inputs.config).variant }}"
          library_bindings="$(ldd "$RUNNER_TEMP/${{ fromJSON(inputs.config).configuration }}/VTestDriver")"
          printf '%s\n' "$library_bindings"
          if [[ "$library_bindings" == *"not found"* ]]; then
            echo "simulator has unresolved shared libraries" >&2
            exit 1
          fi
          python3 sims/arch-test/payload.py verify --bundle "$RUNNER_TEMP/act" --configuration "$RUNNER_TEMP/act/configuration.json"
          mkdir -p /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/elfs
          cp "$RUNNER_TEMP/act/configuration.json" /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/configuration.json
          tar -xzf "$RUNNER_TEMP/act/elfs.tar.gz" -C /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/elfs
      - name: Identify execution inputs
        id: execution-identity
        env:
          SELECTION: ${{ inputs.config }}
        run: |
          python3 sims/program-test/execution.py prepare --kind arch \
            --simulator "$RUNNER_TEMP/${{ fromJSON(inputs.config).configuration }}/VTestDriver" \
            --metadata "$RUNNER_TEMP/${{ fromJSON(inputs.config).configuration }}/VTestDriver.json" \
            --elf-dir /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/elfs \
            --shard-index ${{ fromJSON(inputs.config).shard }} --shard-count ${{ fromJSON(inputs.config).shard_count }} \
            --selection "$SELECTION" --output "$RHODIUM_EXECUTION_CONTEXT" >> "$GITHUB_OUTPUT"
      - name: Restore exact execution evidence
        id: evidence-cache
        if: steps.execution-identity.outputs.key != '' && env.RHODIUM_FORCE_FRESH_EXECUTION != '1'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RHODIUM_EXECUTION_CACHE }}
          key: execution-${{ steps.execution-identity.outputs.key }}
      - name: Run or recheck the complete deterministic shard
        id: run
        env:
          RTL_BACKEND: ${{ fromJSON(inputs.config).backend }}
          COSIM: ${{ fromJSON(inputs.config).cosim && '1' || '0' }}
          STATS: ${{ fromJSON(inputs.config).stats && '1' || '0' }}
          SHARD: ${{ fromJSON(inputs.config).shard }}
        run: |
          set -o pipefail
          target="rhodium:act--${{ fromJSON(inputs.config).configuration }}--shard-$SHARD"
          rm -f .moon/cache/runReport.json
          status=0
          ACT_PYTHON=python3 PREBUILT_SIMULATOR="$RUNNER_TEMP/${{ fromJSON(inputs.config).configuration }}/VTestDriver" \
            ACT_JOBS=2 moon run "$target" --upstream none 2>&1 | tee "$RUNNER_TEMP/act/run.log" || status=1
          python3 -m tools.ci.receipts "$target" || status=1
          exit "$status"
      - name: Check complete functional evidence
        id: evidence-ready
        if: ${{ always() && !cancelled() && steps.execution-identity.outputs.key != '' && steps.run.conclusion == 'success' }}
        run: |
          python3 sims/program-test/execution.py ready --context "$RHODIUM_EXECUTION_CONTEXT" \
            --directory "$RHODIUM_EXECUTION_CACHE" >> "$GITHUB_OUTPUT"
      - name: Save successful execution evidence
        if: ${{ always() && !cancelled() && steps.evidence-ready.outputs.ready == 'true' && steps.evidence-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RHODIUM_EXECUTION_CACHE }}
          key: execution-${{ steps.execution-identity.outputs.key }}
      - name: Publish shard results and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.config).configuration }}-arch-${{ fromJSON(inputs.config).shard }}-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/act/run.log
            /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/shards/${{ fromJSON(inputs.config).shard }}/inventory.json
            /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/shards/${{ fromJSON(inputs.config).shard }}/results.json
            /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/shards/${{ fromJSON(inputs.config).shard }}/junit.xml
            /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/shards/${{ fromJSON(inputs.config).shard }}/summary.log
            /tmp/rhodium-arch-test/work/${{ fromJSON(inputs.config).configuration }}/${{ fromJSON(inputs.config).configuration }}/shards/${{ fromJSON(inputs.config).shard }}/logs
          if-no-files-found: warn
          retention-days: 7

      - uses: ./.github/actions/upload-endpoints
        if: always()
