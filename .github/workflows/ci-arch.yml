# Runs a config's ACT shards when its simulator and payload are ready.
# SPDX-License-Identifier: Apache-2.0

name: CI ACT

on:
  workflow_call:
    inputs:
      matrix:
        description: Architectural execution shards for one exact simulator.
        required: true
        type: string

permissions:
  contents: read

jobs:
  arch:
    name: Run / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RHODIUM_FORCE_FRESH_EXECUTION: ${{ github.event.inputs.force_fresh == 'true' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Locate execution evidence
        run: |
          echo "RHODIUM_EXECUTION_CACHE=$RUNNER_TEMP/execution-evidence" >> "$GITHUB_ENV"
          echo "RHODIUM_EXECUTION_CONTEXT=$RUNNER_TEMP/execution-context.json" >> "$GITHUB_ENV"
      - name: Initialize upstream runner
        run: git submodule update --init sw/riscv-arch-test
      - name: Install Spike runtime dependencies
        if: matrix.core == 'spike'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential device-tree-compiler zlib1g-dev
      - name: Restore pinned Spike runtime libraries
        if: matrix.core == 'spike'
        uses: ./.github/actions/setup-fesvr
      - name: Install Sail cosim runtime dependency
        if: matrix.cosim
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgmp10
      - name: Download exact simulator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.configuration }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.configuration }}
      - name: Download exact ACT payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.configuration }}-arch-elfs-${{ github.sha }}
          path: ${{ runner.temp }}/act
      - name: Verify and unpack shared artifacts
        run: |
          chmod +x "$RUNNER_TEMP/${{ matrix.configuration }}/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "$RUNNER_TEMP/${{ matrix.configuration }}/VTestDriver" --soc ${{ matrix.configuration }} \
            --backend "${{ matrix.backend }}" --variant "${{ matrix.variant }}"
          library_bindings="$(ldd "$RUNNER_TEMP/${{ matrix.configuration }}/VTestDriver")"
          printf '%s\n' "$library_bindings"
          if [[ "$library_bindings" == *"not found"* ]]; then
            echo "simulator has unresolved shared libraries" >&2
            exit 1
          fi
          python3 sims/arch-test/payload.py verify --bundle "$RUNNER_TEMP/act" --configuration "$RUNNER_TEMP/act/configuration.json"
          mkdir -p /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/elfs
          cp "$RUNNER_TEMP/act/configuration.json" /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/configuration.json
          tar -xzf "$RUNNER_TEMP/act/elfs.tar.gz" -C /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/elfs
      - name: Identify execution inputs
        id: execution-identity
        env:
          SELECTION: ${{ toJSON(matrix) }}
        run: |
          python3 sims/program-test/execution.py prepare --kind arch \
            --simulator "$RUNNER_TEMP/${{ matrix.configuration }}/VTestDriver" \
            --metadata "$RUNNER_TEMP/${{ matrix.configuration }}/VTestDriver.json" \
            --elf-dir /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/elfs \
            --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.shard_count }} \
            --selection "$SELECTION" --output "$RHODIUM_EXECUTION_CONTEXT" >> "$GITHUB_OUTPUT"
      - name: Restore exact execution evidence
        id: evidence-cache
        if: steps.execution-identity.outputs.key != '' && env.RHODIUM_FORCE_FRESH_EXECUTION != '1'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RHODIUM_EXECUTION_CACHE }}
          key: execution-${{ steps.execution-identity.outputs.key }}
      - name: Run or recheck the complete deterministic shard
        id: run
        env:
          RTL_BACKEND: ${{ matrix.backend }}
          COSIM: ${{ matrix.cosim && '1' || '0' }}
          STATS: ${{ matrix.stats && '1' || '0' }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          make -C sims arch-test-run ACT_CONFIGURATION=${{ matrix.configuration }} ACT_PYTHON=python3 \
            PREBUILT_SIMULATOR="$RUNNER_TEMP/${{ matrix.configuration }}/VTestDriver" \
            ACT_JOBS=2 ACT_SHARDS=${{ matrix.shard_count }} ACT_SHARD="$SHARD" 2>&1 | tee "$RUNNER_TEMP/act/run.log"
      - name: Check complete functional evidence
        id: evidence-ready
        if: ${{ always() && !cancelled() && steps.execution-identity.outputs.key != '' && steps.run.conclusion == 'success' }}
        run: |
          python3 sims/program-test/execution.py ready --context "$RHODIUM_EXECUTION_CONTEXT" \
            --directory "$RHODIUM_EXECUTION_CACHE" >> "$GITHUB_OUTPUT"
      - name: Save successful execution evidence
        if: ${{ always() && !cancelled() && steps.evidence-ready.outputs.ready == 'true' && steps.evidence-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.RHODIUM_EXECUTION_CACHE }}
          key: execution-${{ steps.execution-identity.outputs.key }}
      - name: Publish shard results and inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.configuration }}-arch-${{ matrix.shard }}-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/act/run.log
            /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/shards/${{ matrix.shard }}/inventory.json
            /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/shards/${{ matrix.shard }}/results.json
            /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/shards/${{ matrix.shard }}/junit.xml
            /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/shards/${{ matrix.shard }}/summary.log
            /tmp/rhodium-arch-test/work/${{ matrix.configuration }}/${{ matrix.configuration }}/shards/${{ matrix.shard }}/logs
          if-no-files-found: warn
          retention-days: 7
