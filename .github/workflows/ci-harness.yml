# Builds software and executes one attested config without unrelated hardware toolchains.
# SPDX-License-Identifier: Apache-2.0

name: CI harness

on:
  workflow_call:
    inputs:
      racket-version:
        description: Racket version for mapped Mini checks only.
        required: true
        type: string
      rhombus-checksum:
        description: Rhombus checksum for mapped Mini checks only.
        required: true
        type: string
      config:
        description: One planner-selected config and software selection.
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23'
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23'
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install mapped or Spike build dependencies
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23' || fromJSON(inputs.config).core == 'spike'
        run: |
          packages=(build-essential device-tree-compiler zlib1g-dev)
          if [[ "${{ fromJSON(inputs.config).soc }}" == mini-rv5stage-rva23 ]]; then
            packages+=(clang cmake lld llvm)
          fi
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install --yes "${packages[@]}"
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Install Verilator
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23'
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23'
        uses: ./.github/actions/setup-circt
      - name: Install FESVR
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23' || fromJSON(inputs.config).core == 'spike'
        uses: ./.github/actions/setup-fesvr
      - name: Verify SRAM mapping package
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23'
        run: make -C sram test
      - name: Install Sail cosim runtime dependency
        if: fromJSON(inputs.config).cosim
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgmp10
      - name: Download exact config simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ fromJSON(inputs.config).simulator_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ fromJSON(inputs.config).simulator_id }}
      - name: Verify exact config and target descriptor
        env:
          SOC: ${{ fromJSON(inputs.config).soc }}
          RTL_BACKEND: ${{ fromJSON(inputs.config).backend }}
          SIMULATOR_ID: ${{ fromJSON(inputs.config).simulator_id }}
        run: |
          chmod +x "$RUNNER_TEMP/$SIMULATOR_ID/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "$RUNNER_TEMP/$SIMULATOR_ID/VTestDriver" \
            --soc "$SOC" --backend "$RTL_BACKEND" --variant "${{ fromJSON(inputs.config).cosim && 'cosim' || 'normal' }}" --target "$RUNNER_TEMP/$SIMULATOR_ID/program-target.json"
      - name: Prepare upstream ISA sources
        if: contains(fromJSON(inputs.config).software_tests, 'isa-smoke')
        run: make -C sims isa-setup
      - name: Run shape-and-ISA software selection
        timeout-minutes: ${{ fromJSON(inputs.config).harness_timeout_minutes || 60 }}
        shell: bash
        env:
          SOC: ${{ fromJSON(inputs.config).soc }}
          RTL_BACKEND: ${{ fromJSON(inputs.config).backend }}
          SIMULATOR_ID: ${{ fromJSON(inputs.config).simulator_id }}
          COSIM: ${{ fromJSON(inputs.config).cosim && '1' || '0' }}
          SOFTWARE_TESTS: ${{ fromJSON(inputs.config).software_tests }}
          SMOKE_MAX_CYCLES: ${{ fromJSON(inputs.config).smoke_max_cycles }}
        run: |
          simulator="$RUNNER_TEMP/$SIMULATOR_ID/VTestDriver"
          run_args=()
          if [[ "${SMOKE_MAX_CYCLES:-0}" -gt 0 ]]; then
            run_args+=("HTIF_ARGS=+max-cycles=$SMOKE_MAX_CYCLES")
          fi
          status=0
          for target in $SOFTWARE_TESTS; do
            make -C sims "$target" SOC="$SOC" PROGRAM_JOBS=2 \
              PREBUILT_SIMULATOR="$simulator" "${run_args[@]}" 2>&1 | tee "$RUNNER_TEMP/$SIMULATOR_ID-$target.log" || status=1
          done
          exit "$status"
      - name: Verify RV5Stage-specific NTL cache timing
        if: fromJSON(inputs.config).backend == 'circt' && fromJSON(inputs.config).soc == 'simple-rv5stage-rva23'
        run: make -C sims zihintntl-policy-test COSIM=1 SOC=simple-rv5stage-rva23 PREBUILT_SIMULATOR="$RUNNER_TEMP/simple-rv5stage-rva23/VTestDriver"
      - name: Execute mapped MiniRV5StageSoC through standard FESVR flow
        if: fromJSON(inputs.config).soc == 'mini-rv5stage-rva23'
        run: make -C vlsi/sim smoke
      - name: Package completed ISA smoke ELFs
        if: always() && contains(fromJSON(inputs.config).software_tests, 'isa-smoke')
        run: |
          manifest="/tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/manifest.json"
          if [[ -f "$manifest" ]]; then
            python3 sims/program-test/archive.py --manifest "$manifest" \
              --archive "$RUNNER_TEMP/isa-smoke-elfs/${{ fromJSON(inputs.config).soc }}.tar.gz"
          fi
      - name: Publish config smoke and multihart results
        if: always() && contains(fromJSON(inputs.config).software_tests, 'isa-smoke')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ fromJSON(inputs.config).soc }}-isa-smoke-${{ github.sha }}
          path: |
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/target.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/manifest.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/build.log
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/results
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/manifest.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/instruction-report.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/build.log
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/results
            ${{ runner.temp }}/isa-smoke-elfs
          if-no-files-found: warn
          retention-days: 7
      - name: Publish standalone SoC smoke ELFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ fromJSON(inputs.config).simulator_id }}-smoke-elfs-${{ github.sha }}
          path: /tmp/rhodium-sims/${{ fromJSON(inputs.config).simulator_id }}/*.elf
          if-no-files-found: warn
          retention-days: 7

      - name: Publish harness logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-logs-${{ fromJSON(inputs.config).simulator_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ fromJSON(inputs.config).simulator_id }}-*.log
          if-no-files-found: warn
          retention-days: 7
