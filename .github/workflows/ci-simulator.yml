# Builds, publishes, and tests each simulator on one runner with shared dependencies.
# SPDX-License-Identifier: Apache-2.0

name: CI simulator

on:
  workflow_call:
    inputs:
      racket-version:
        description: Installed Racket version.
        required: true
        type: string
      rhombus-checksum:
        description: Pinned Rhombus package checksum.
        required: true
        type: string
      config:
        description: One config selected by the CI planner.
        required: true
        type: string
      run-harness:
        description: Run this config's selected harness tests after publication.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          packages=(build-essential cmake device-tree-compiler zlib1g-dev)
          if [[ "${{ inputs.run-harness }}" == true && "${{ fromJSON(inputs.config).soc }}" == mini-rv5stage-rva23 ]]; then
            packages+=(clang lld llvm)
          fi
          sudo apt-get install --yes "${packages[@]}"
      - name: Install Verilator
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        if: fromJSON(inputs.config).backend == 'circt' || (inputs.run-harness && fromJSON(inputs.config).soc == 'mini-rv5stage-rva23')
        uses: ./.github/actions/setup-circt
      - name: Install Spike and FESVR
        uses: ./.github/actions/setup-fesvr
      - name: Prepare Sail cosim dependencies
        if: fromJSON(inputs.config).cosim
        run: |
          sudo apt-get install --yes libgmp-dev z3 python3-venv
          python3 -m venv .tools/cosim-python
          .tools/cosim-python/bin/pip install 'ruamel.yaml==0.18.10' 'pyjson5==1.6.8'
      - name: Download exact-commit Sail model
        if: fromJSON(inputs.config).cosim
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sail-riscv-${{ github.sha }}
          path: ${{ runner.temp }}/sail-riscv
      - name: Install patched Sail model
        if: fromJSON(inputs.config).cosim
        run: |
          mkdir -p .tools
          tar -xzf "$RUNNER_TEMP/sail-riscv/model.tar.gz" -C .tools
          tar -xzf "$RUNNER_TEMP/sail-riscv/runtime.tar.gz" -C .
      - name: Download shared target descriptions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/targets
      - name: Build and attest simulator
        timeout-minutes: 60
        id: simulator
        shell: bash
        env:
          SOC: ${{ fromJSON(inputs.config).soc }}
          RTL_BACKEND: ${{ fromJSON(inputs.config).backend }}
          SIMULATOR_ID: ${{ fromJSON(inputs.config).simulator_id }}
          OPT_FAST: ${{ fromJSON(inputs.config).opt_fast }}
          COSIM: ${{ fromJSON(inputs.config).cosim && '1' || '0' }}
          STATS: ${{ fromJSON(inputs.config).stats && '1' || '0' }}
          COSIM_PYTHON: ${{ github.workspace }}/.tools/cosim-python/bin/python
        run: |
          build_args=()
          if [[ -n "$OPT_FAST" ]]; then build_args+=("OPT_FAST=$OPT_FAST"); fi
          if [[ "$COSIM" == 1 ]]; then
            identity=$(python3 riscv/patched_submodule.py identity --repository . --submodule riscv/sail-riscv --series riscv/sail-riscv-patches/series)
            build_args+=("PREBUILT_COSIM_DIR=$GITHUB_WORKSPACE/.rhodium-cache/sail-cosim/sail-0.20.3-$identity")
          fi
          # An empty override must leave the simulator Makefile defaults intact.
          unset OPT_FAST
          build="/tmp/rhodium-sims/$SIMULATOR_ID"
          if [[ "$COSIM" == 1 ]]; then build="$build-cosim"; fi
          if [[ "$STATS" == 1 ]]; then build="$build-stats"; fi
          mkdir -p "$build/obj"
          cp "$RUNNER_TEMP/targets/$SOC.json" "$build/obj/program-target.json"
          echo "path=$build/obj" >> "$GITHUB_OUTPUT"
          echo "directory=$build" >> "$GITHUB_OUTPUT"
          make -C sims simulator program-target SOC="$SOC" "${build_args[@]}" \
            PREBUILT_PROGRAM_TARGET="$build/obj/program-target.json" VERILATOR='verilator --stats' 2>&1 | tee "$RUNNER_TEMP/$SIMULATOR_ID-build.log"
          ldd "$build/obj/VTestDriver" | tee "$RUNNER_TEMP/simulator-libraries.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/simulator-libraries.txt"
      - name: Publish exact simulator and target descriptor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.config).simulator_id }}-${{ github.sha }}
          path: |
            ${{ steps.simulator.outputs.path }}/VTestDriver
            ${{ steps.simulator.outputs.path }}/VTestDriver.json
            ${{ steps.simulator.outputs.path }}/program-target.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish simulator build diagnostics
        if: always() && steps.simulator.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-build-${{ fromJSON(inputs.config).simulator_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ fromJSON(inputs.config).simulator_id }}-build.log
            ${{ steps.simulator.outputs.path }}/VTestDriver__stats*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Install RISC-V software toolchain
        if: inputs.run-harness && (fromJSON(inputs.config).software_tests != 'isa-smoke')
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Verify SRAM mapping package
        if: inputs.run-harness && (fromJSON(inputs.config).soc == 'mini-rv5stage-rva23')
        run: make -C sram test
      - name: Verify exact config and target descriptor
        if: inputs.run-harness
        env:
          SOC: ${{ fromJSON(inputs.config).soc }}
          RTL_BACKEND: ${{ fromJSON(inputs.config).backend }}
        run: |
          chmod +x "${{ steps.simulator.outputs.path }}/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "${{ steps.simulator.outputs.path }}/VTestDriver" \
            --soc "$SOC" --backend "$RTL_BACKEND" --variant "${{ fromJSON(inputs.config).variant }}" --target "${{ steps.simulator.outputs.path }}/program-target.json"
      - name: Download shared harness ELFs
        if: inputs.run-harness && (contains(fromJSON(inputs.config).software_tests, 'isa-smoke') || contains(fromJSON(inputs.config).software_tests, 'tiled-mt-benchmark-test'))
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: harness-elfs-*-${{ github.sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/harness-elfs
      - name: Run shape-and-ISA software selection
        if: inputs.run-harness
        timeout-minutes: ${{ fromJSON(inputs.config).harness_timeout_minutes || 60 }}
        shell: bash
        env:
          SOC: ${{ fromJSON(inputs.config).soc }}
          RTL_BACKEND: ${{ fromJSON(inputs.config).backend }}
          SIMULATOR_ID: ${{ fromJSON(inputs.config).simulator_id }}
          COSIM: ${{ fromJSON(inputs.config).cosim && '1' || '0' }}
          STATS: ${{ fromJSON(inputs.config).stats && '1' || '0' }}
          SOFTWARE_TESTS: ${{ fromJSON(inputs.config).software_tests }}
          SMOKE_MAX_CYCLES: ${{ fromJSON(inputs.config).smoke_max_cycles }}
        run: |
          mkdir -p "$RUNNER_TEMP/harness-logs"
          simulator="${{ steps.simulator.outputs.path }}/VTestDriver"
          run_args=()
          if [[ "${SMOKE_MAX_CYCLES:-0}" -gt 0 ]]; then
            run_args+=("HTIF_ARGS=+max-cycles=$SMOKE_MAX_CYCLES")
          fi
          status=0
          for target in $SOFTWARE_TESTS; do
            manifest_args=()
            run_target="$target"
            case "$target" in
              isa-smoke) run_target=isa-smoke-run; output="/tmp/rhodium-program-tests/$SOC/isa-smoke" ;;
              tiled-mt-benchmark-test) run_target=tiled-mt-benchmark-run; output="/tmp/rhodium-program-tests/$SOC/mt-benchmark/8-harts" ;;
            esac
            if [[ "$run_target" != "$target" ]]; then
              build_id=$(jq -er --arg soc "$SOC" --arg run "$run_target" \
                '.run.include[] | select(.soc == $soc and .run_target == $run) | .build_id' \
                "$RUNNER_TEMP/targets/harness-plan.json") || { status=1; continue; }
              mkdir -p "$output"
              if ! tar -xzf "$RUNNER_TEMP/harness-elfs/$build_id.tar.gz" -C "$output" ||
                 ! python3 sw/build/bind.py --manifest "$output/manifest.json" \
                   --target "${{ steps.simulator.outputs.path }}/program-target.json" --output "$output/run-manifest.json"; then
                status=1
                continue
              fi
              manifest_args=("PROGRAM_MANIFEST=$output/run-manifest.json")
            fi
            make -C sims "$run_target" SOC="$SOC" PROGRAM_JOBS=2 \
              PREBUILT_SIMULATOR="$simulator" "${run_args[@]}" "${manifest_args[@]}" 2>&1 | tee "$RUNNER_TEMP/harness-logs/$SIMULATOR_ID-$target.log" || status=1
          done
          exit "$status"
      - name: Summarize multihart whole-ELF cycles
        if: always() && inputs.run-harness && contains(fromJSON(inputs.config).software_tests, 'tiled-mt-benchmark-test')
        run: |
          if [[ -d /tmp/rhodium-program-tests ]]; then
            python3 sims/program-test/performance.py summary --results /tmp/rhodium-program-tests >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish importable multihart performance measurements
        if: always() && inputs.run-harness && contains(fromJSON(inputs.config).software_tests, 'tiled-mt-benchmark-test')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ fromJSON(inputs.config).soc }}-multihart-${{ github.sha }}
          path: /tmp/rhodium-program-tests/*/mt-benchmark/*-harts/results/performance.json
          if-no-files-found: warn
          retention-days: 30
      - name: Verify RV5Stage-specific NTL cache timing
        if: inputs.run-harness && (fromJSON(inputs.config).backend == 'rsim' && fromJSON(inputs.config).soc == 'simple-rv5stage-rva23')
        run: make -C sims zihintntl-policy-test RTL_BACKEND=rsim COSIM=1 STATS=1 SOC=simple-rv5stage-rva23 PREBUILT_SIMULATOR="${{ steps.simulator.outputs.path }}/VTestDriver"
      - name: Execute mapped MiniRV5StageSoC through standard FESVR flow
        if: inputs.run-harness && (fromJSON(inputs.config).soc == 'mini-rv5stage-rva23')
        run: make -C vlsi/sim smoke
      - name: Publish config smoke and multihart results
        if: always() && inputs.run-harness && contains(fromJSON(inputs.config).software_tests, 'isa-smoke')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.config).soc }}-isa-smoke-${{ github.sha }}
          path: |
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/target.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/manifest.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/run-manifest.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/build.log
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/isa-smoke/results
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/manifest.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/run-manifest.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/instruction-report.json
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/build.log
            /tmp/rhodium-program-tests/${{ fromJSON(inputs.config).soc }}/mt-benchmark/*-harts/results
          if-no-files-found: warn
          retention-days: 7
      - name: Publish standalone SoC smoke ELFs
        if: always() && inputs.run-harness && steps.simulator.outputs.directory != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ fromJSON(inputs.config).simulator_id }}-smoke-elfs-${{ github.sha }}
          path: ${{ steps.simulator.outputs.directory }}/*.elf
          if-no-files-found: warn
          retention-days: 7

      - name: Publish harness logs
        if: always() && inputs.run-harness
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-logs-${{ fromJSON(inputs.config).simulator_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/harness-logs
          if-no-files-found: warn
          retention-days: 7
