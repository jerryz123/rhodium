# Builds one attested simulator and starts its harness without waiting for other configs.
# SPDX-License-Identifier: Apache-2.0

name: CI simulator

on:
  workflow_call:
    inputs:
      racket-version:
        description: Installed Racket version.
        required: true
        type: string
      rhombus-checksum:
        description: Pinned Rhombus package checksum.
        required: true
        type: string
      config:
        description: One config selected by the CI planner.
        required: true
        type: string
      run-harness:
        description: Run this config's selected harness tests after publication.
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: ./.github/actions/setup-racket
        with:
          racket-version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake device-tree-compiler zlib1g-dev
      - name: Install Verilator
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        if: fromJSON(inputs.config).backend == 'circt'
        uses: ./.github/actions/setup-circt
      - name: Install Spike and FESVR
        uses: ./.github/actions/setup-fesvr
      - name: Prepare Sail cosim dependencies
        if: fromJSON(inputs.config).cosim
        id: cosim-source
        run: |
          sudo apt-get install --yes libgmp-dev z3 python3-venv
          git submodule update --init riscv/sail-riscv
          echo "revision=$(git rev-parse HEAD:riscv/sail-riscv)" >> "$GITHUB_OUTPUT"
          python3 -m venv .tools/cosim-python
          .tools/cosim-python/bin/pip install 'ruamel.yaml==0.18.10' 'pyjson5==1.6.8'
      - name: Cache embedded Sail model and compiler
        if: fromJSON(inputs.config).cosim
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/sail-compiler-0.20.3
            .tools/sail-riscv-0.14.1-sail-0.20.3-*
          key: "${{ runner.os }}-${{ runner.arch }}-sail-0.20.3-${{ steps.cosim-source.outputs.revision }}-${{ hashFiles('riscv/sail-riscv-patches/**', 'riscv/patched_submodule.py', 'sims/arch-test/install-sail.sh', 'sims/sail/SailModelConfig.cmake') }}"
      - name: Build embedded Sail model
        if: fromJSON(inputs.config).cosim
        run: make -C sims arch-test-sail-setup
      - name: Build and attest simulator
        id: simulator
        shell: bash
        env:
          SOC: ${{ fromJSON(inputs.config).soc }}
          RTL_BACKEND: ${{ fromJSON(inputs.config).backend }}
          SIMULATOR_ID: ${{ fromJSON(inputs.config).simulator_id }}
          OPT_FAST: ${{ fromJSON(inputs.config).opt_fast }}
          COSIM: ${{ fromJSON(inputs.config).cosim && '1' || '0' }}
          COSIM_PYTHON: ${{ github.workspace }}/.tools/cosim-python/bin/python
        run: |
          build_args=()
          if [[ -n "$OPT_FAST" ]]; then build_args+=("OPT_FAST=$OPT_FAST"); fi
          # An empty override must leave the simulator Makefile defaults intact.
          unset OPT_FAST
          build="/tmp/rhodium-sims/$SIMULATOR_ID"
          if [[ "$COSIM" == 1 ]]; then build="$build-cosim"; fi
          echo "path=$build/obj" >> "$GITHUB_OUTPUT"
          make -C sims simulator program-target SOC="$SOC" "${build_args[@]}" VERILATOR='verilator --stats' 2>&1 | tee "$RUNNER_TEMP/$SIMULATOR_ID-build.log"
          ldd "$build/obj/VTestDriver" | tee "$RUNNER_TEMP/simulator-libraries.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/simulator-libraries.txt"
      - name: Test Spike DPI integration
        if: fromJSON(inputs.config).core == 'spike'
        run: |
          verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
          test -n "$verilator_root"
          make -C sims spike-core-test spike-dpi-abi-check VERILATOR_ROOT="$verilator_root"
      - name: Test native harness adapters
        if: inputs.run-harness && fromJSON(inputs.config).backend == 'circt' && fromJSON(inputs.config).soc == 'simple-rv5stage-rva23'
        run: |
          verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
          test -n "$verilator_root"
          make -C sims dpi-compile-check VERILATOR_ROOT="$verilator_root"
          make -C sims transport-test arch-test-adapter-test program-test-adapter-test cosim-hooks-test simulation-runtime-test
      - name: Publish exact simulator and target descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ fromJSON(inputs.config).simulator_id }}-${{ github.sha }}
          path: |
            ${{ steps.simulator.outputs.path }}/VTestDriver
            ${{ steps.simulator.outputs.path }}/VTestDriver.json
            ${{ steps.simulator.outputs.path }}/program-target.json
          if-no-files-found: error
          retention-days: 3

      - name: Publish simulator build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-build-${{ fromJSON(inputs.config).simulator_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/${{ fromJSON(inputs.config).simulator_id }}-build.log
            ${{ steps.simulator.outputs.path }}/VTestDriver__stats*.txt
          if-no-files-found: warn
          retention-days: 7

  harness:
    name: Test
    needs: build
    if: inputs.run-harness
    uses: ./.github/workflows/ci-harness.yml
    with:
      config: ${{ inputs.config }}
      racket-version: ${{ inputs.racket-version }}
      rhombus-checksum: ${{ inputs.rhombus-checksum }}
