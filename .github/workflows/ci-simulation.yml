# Shares platform qualification builds and runs each SoC's attested harness and software independently.
# SPDX-License-Identifier: Apache-2.0

name: CI simulation

on:
  workflow_call:
    inputs:
      racket-version:
        description: Installed Racket version.
        required: true
        type: string
      rhombus-checksum:
        description: Pinned Rhombus package checksum.
        required: true
        type: string
      matrix:
        description: Qualified product simulation matrix selected by the CI planner.
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.soc }} harness and smoke
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake device-tree-compiler lld llvm zlib1g-dev
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Install Verilator
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        uses: ./.github/actions/setup-circt
      - name: Install FESVR
        uses: ./.github/actions/setup-fesvr
      - name: Verify SRAM mapping package
        if: matrix.soc == 'mini-rv5stage-rva23'
        run: make -C sram test
      - name: Compile Verilator DPI adapter
        if: matrix.soc == 'simple-rv5stage-rva23'
        run: |
          verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
          test -n "$verilator_root"
          make -C sims dpi-compile-check VERILATOR_ROOT="$verilator_root"
      - name: Test host adapters
        if: matrix.soc == 'simple-rv5stage-rva23'
        run: make -C sims transport-test arch-test-adapter-test program-test-adapter-test
      - name: Download exact product simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.soc }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.soc }}
      - name: Verify exact product and target descriptor
        env:
          SOC: ${{ matrix.soc }}
        run: |
          chmod +x "$RUNNER_TEMP/$SOC/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "$RUNNER_TEMP/$SOC/VTestDriver" \
            --soc "$SOC" --target "$RUNNER_TEMP/$SOC/program-target.json"
      - name: Prepare upstream ISA sources
        if: matrix.shape != 'simple'
        run: make -C sims isa-setup
      - name: Run shape-and-ISA software selection
        env:
          SOC: ${{ matrix.soc }}
          SOFTWARE_TESTS: ${{ matrix.software_tests }}
        run: |
          simulator="$RUNNER_TEMP/$SOC/VTestDriver"
          status=0
          for target in $SOFTWARE_TESTS; do
            make -C sims "$target" SOC="$SOC" PROGRAM_JOBS=2 \
              PREBUILT_SIMULATOR="$simulator" || status=1
          done
          exit "$status"
      - name: Verify RV5Stage-specific NTL cache timing
        if: matrix.soc == 'simple-rv5stage-rva23'
        run: make -C sims zihintntl-policy-test SOC=simple-rv5stage-rva23 PREBUILT_SIMULATOR="$RUNNER_TEMP/simple-rv5stage-rva23/VTestDriver"
      - name: Execute mapped MiniRV5StageSoC through standard FESVR flow
        if: matrix.soc == 'mini-rv5stage-rva23'
        run: make -C vlsi/sim smoke
      - name: Package completed ISA smoke ELFs
        if: always() && matrix.shape != 'simple'
        run: |
          manifest="/tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/manifest.json"
          if [[ -f "$manifest" ]]; then
            python3 sims/program-test/archive.py --manifest "$manifest" \
              --archive "$RUNNER_TEMP/isa-smoke-elfs/${{ matrix.soc }}.tar.gz"
          fi
      - name: Publish product smoke and multihart results
        if: always() && matrix.shape != 'simple'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.soc }}-isa-smoke-${{ github.sha }}
          path: |
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/target.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/manifest.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/build.log
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/results
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/manifest.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/instruction-report.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/build.log
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/results
            ${{ runner.temp }}/isa-smoke-elfs
          if-no-files-found: warn
          retention-days: 7
      - name: Publish standalone SoC smoke ELFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.soc }}-smoke-elfs-${{ github.sha }}
          path: /tmp/rhodium-sims/${{ matrix.soc }}/*.elf
          if-no-files-found: warn
          retention-days: 7

  qualification-plan:
    name: Group platform qualification builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      run-matrix: ${{ steps.plan.outputs.run-matrix }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Generate target and platform build identities
        id: plan
        run: |
          matrix=$(python3 -c 'import json; from tools.ci.policy import qualification_products; print(json.dumps({"include": qualification_products()}))')
          mkdir -p "$RUNNER_TEMP/qualification-targets"
          for soc in $(jq -r '[.include[].soc] | unique | .[]' <<< "$matrix"); do
            tools/run-racket.sh -S "$GITHUB_WORKSPACE" sims/program-test/write-target.rhm \
              "$soc" "$RUNNER_TEMP/qualification-targets/$soc.json"
          done
          for soc in $(jq -r '.include[] | select(.suite == "opensbi") | .soc' <<< "$matrix"); do
            tools/run-racket.sh -S "$GITHUB_WORKSPACE" sims/opensbi/write-device-tree.rhm \
              "$soc" "$RUNNER_TEMP/qualification-targets/$soc.dtb"
          done
          python3 -m tools.ci.programs --matrix "$matrix" \
            --targets "$RUNNER_TEMP/qualification-targets" --fdts "$RUNNER_TEMP/qualification-targets" \
            --output "$RUNNER_TEMP/qualification-plan.json"
          echo "build-matrix=$(jq -c .build "$RUNNER_TEMP/qualification-plan.json")" >> "$GITHUB_OUTPUT"
          echo "run-matrix=$(jq -c .run "$RUNNER_TEMP/qualification-plan.json")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/qualification-plan.json"
      - name: Test qualification adapters once
        run: make -C sims litmus-setup litmus-adapter-test opensbi-adapter-test
      - name: Publish qualification target descriptions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-targets-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-targets
          if-no-files-found: error
          retention-days: 3

  qualification-build:
    name: Build ${{ matrix.suite }} artifacts (${{ matrix.soc }})
    needs: qualification-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.build-matrix) }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang libgmp-dev lld llvm opam
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Build pinned litmus7
        if: matrix.suite == 'litmus'
        env:
          HERDTOOLS7_REVISION: 7a64d9d8480ae02d9065b2778b4f2d473c6595ae
        run: |
          git clone --filter=blob:none https://github.com/herd/herdtools7.git "$RUNNER_TEMP/herdtools7"
          git -C "$RUNNER_TEMP/herdtools7" checkout "$HERDTOOLS7_REVISION"
          test "$(git -C "$RUNNER_TEMP/herdtools7" rev-parse HEAD)" = "$HERDTOOLS7_REVISION"
          opam init --bare --disable-sandboxing --yes
          opam switch create litmus ocaml-base-compiler.4.14.2 --yes
          opam install --switch=litmus --yes --deps-only "$RUNNER_TEMP/herdtools7/herdtools7.opam"
          opam exec --switch=litmus -- make -C "$RUNNER_TEMP/herdtools7" build-aslref
          opam exec --switch=litmus -- make -C "$RUNNER_TEMP/herdtools7" install-aslref PREFIX="$(opam var --switch=litmus prefix)"
          opam exec --switch=litmus -- make -C "$RUNNER_TEMP/herdtools7" build-release
          test -x "$RUNNER_TEMP/herdtools7/_build/default/litmus/litmus.exe"
          test "$("$RUNNER_TEMP/herdtools7/_build/default/litmus/litmus.exe" -version)" = '7.58+1'
          echo "LITMUS7=$RUNNER_TEMP/herdtools7/_build/default/litmus/litmus.exe" >> "$GITHUB_ENV"
          echo "LITMUS7_LIBDIR=$RUNNER_TEMP/herdtools7/litmus/libdir" >> "$GITHUB_ENV"
      - name: Prepare pinned sources
        env:
          SUITE: ${{ matrix.suite }}
        run: make -C sims "$SUITE-setup"
      - name: Download generated targets and device trees
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-targets-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-targets
      - name: Cache qualification builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/rhodium-qualification-builds/${{ matrix.build_id }}/build
            /tmp/rhodium-qualification-builds/${{ matrix.build_id }}/build-configuration.json
          key: "${{ runner.os }}-${{ runner.arch }}-qualification-${{ matrix.build_id }}-${{ hashFiles('sw/build/**', 'sw/litmus-riscv-baremetal/**', 'sims/opensbi/**', 'sims/program-test/Makefile.inc', 'tools/install-riscv-toolchain.sh', '.github/workflows/ci-simulation.yml') }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-qualification-${{ matrix.build_id }}-${{ hashFiles('sw/build/**', 'sw/litmus-riscv-baremetal/**', 'sims/opensbi/**', 'sims/program-test/Makefile.inc', 'tools/install-riscv-toolchain.sh', '.github/workflows/ci-simulation.yml') }}-
      - name: Build and package shared qualification
        env:
          SOC: ${{ matrix.soc }}
          SUITE: ${{ matrix.suite }}
          BUILD_ID: ${{ matrix.build_id }}
        run: |
          output="/tmp/rhodium-qualification-builds/$BUILD_ID"
          if [[ "$SUITE" == litmus ]]; then
            make -C sims litmus-smoke-elfs SOC="$SOC" \
              PREBUILT_PROGRAM_TARGET="$RUNNER_TEMP/qualification-targets/$SOC.json" LITMUS_SMOKE_DIR="$output"
          else
            make -C sims opensbi-elfs SOC="$SOC" OPENSBI_LLVM=/usr/bin OPENSBI_OUTPUT="$output" \
              PREBUILT_PROGRAM_TARGET="$RUNNER_TEMP/qualification-targets/$SOC.json" \
              PREBUILT_OPENSBI_FDT="$RUNNER_TEMP/qualification-targets/$SOC.dtb"
          fi
          python3 sims/program-test/archive.py --manifest "$output/manifest.json" \
            --archive "$RUNNER_TEMP/qualification-elfs/suite.tar.gz"
      - name: Publish shared qualification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-elfs-${{ matrix.build_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-elfs/suite.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-build-${{ matrix.build_id }}-${{ github.sha }}
          path: |
            /tmp/rhodium-qualification-builds/${{ matrix.build_id }}/manifest.json
            /tmp/rhodium-qualification-builds/${{ matrix.build_id }}/build.log
            /tmp/rhodium-qualification-builds/${{ matrix.build_id }}/build-configuration.json
          if-no-files-found: warn
          retention-days: 7

  qualification:
    name: ${{ matrix.soc }} (${{ matrix.suite }} qualification)
    needs: [qualification-plan, qualification-build]
    if: ${{ always() && !cancelled() && needs.qualification-plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.qualification-plan.outputs.run-matrix) }}
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Spike runtime dependencies
        if: contains(matrix.soc, '-spike-')
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential device-tree-compiler zlib1g-dev
      - name: Restore pinned Spike runtime libraries
        if: contains(matrix.soc, '-spike-')
        uses: ./.github/actions/setup-fesvr
      - name: Download exact product simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.soc }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.soc }}
      - name: Download shared qualification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-elfs-${{ matrix.build_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-elfs
      - name: Download execution target device trees
        if: matrix.suite == 'opensbi'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualification-targets-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-targets
      - name: Verify simulator and bind shared qualification
        env:
          SOC: ${{ matrix.soc }}
          SUITE: ${{ matrix.suite }}
        run: |
          chmod +x "$RUNNER_TEMP/$SOC/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "$RUNNER_TEMP/$SOC/VTestDriver" --soc "$SOC"
          library_bindings=$(ldd "$RUNNER_TEMP/$SOC/VTestDriver")
          printf '%s\n' "$library_bindings"
          if [[ "$library_bindings" == *"not found"* ]]; then exit 1; fi
          output="/tmp/rhodium-qualifications/$SOC/$SUITE"
          mkdir -p "$output"
          tar -xzf "$RUNNER_TEMP/qualification-elfs/suite.tar.gz" -C "$output"
          fdt_args=()
          if [[ "$SUITE" == opensbi ]]; then fdt_args=(--fdt "$RUNNER_TEMP/qualification-targets/$SOC.dtb"); fi
          python3 sw/build/bind.py --manifest "$output/manifest.json" \
            --target "$RUNNER_TEMP/$SOC/program-target.json" --output "$output/run-manifest.json" "${fdt_args[@]}"
      - name: Execute the exact product qualification
        env:
          SOC: ${{ matrix.soc }}
          SUITE: ${{ matrix.suite }}
          RUN_TARGET: ${{ matrix.run_target }}
        run: |
          output="/tmp/rhodium-qualifications/$SOC/$SUITE"
          make -C sims "$RUN_TARGET" SOC="$SOC" PROGRAM_JOBS=2 \
            PREBUILT_SIMULATOR="$RUNNER_TEMP/$SOC/VTestDriver" PROGRAM_MANIFEST="$output/run-manifest.json" \
            LITMUS_SMOKE_DIR="$output" OPENSBI_OUTPUT="$output"
      - name: Publish qualification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.soc }}-${{ matrix.suite }}-qualification-${{ github.sha }}
          path: |
            /tmp/rhodium-qualifications/${{ matrix.soc }}/${{ matrix.suite }}
            ${{ runner.temp }}/qualification-elfs
          if-no-files-found: warn
          retention-days: 7
