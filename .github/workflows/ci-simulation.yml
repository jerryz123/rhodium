# Runs each SoC product independently plus OpenSBI and stalled-memory qualification.
# SPDX-License-Identifier: Apache-2.0

name: CI simulation

on:
  workflow_call:
    inputs:
      racket-version:
        description: Installed Racket version.
        required: true
        type: string
      rhombus-checksum:
        description: Pinned Rhombus package checksum.
        required: true
        type: string
      matrix:
        description: Six-product simulation matrix selected by the CI planner.
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration:
    name: ${{ matrix.soc }} harness and smoke
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake device-tree-compiler lld llvm zlib1g-dev
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Install Verilator
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        uses: ./.github/actions/setup-circt
      - name: Install FESVR
        uses: ./.github/actions/setup-fesvr
      - name: Verify SRAM mapping package
        if: matrix.soc == 'mini-rv5stage-soc'
        run: make -C sram test
      - name: Compile Verilator DPI adapter
        if: matrix.soc == 'single-core-rv5stage-soc'
        run: |
          verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
          test -n "$verilator_root"
          make -C sims dpi-compile-check VERILATOR_ROOT="$verilator_root"
      - name: Test host adapters
        if: matrix.soc == 'single-core-rv5stage-soc'
        run: make -C sims transport-test arch-test-adapter-test program-test-adapter-test
      - name: Download exact product simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.soc }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.soc }}
      - name: Verify exact product and target descriptor
        env:
          SOC: ${{ matrix.soc }}
        run: |
          chmod +x "$RUNNER_TEMP/$SOC/VTestDriver"
          python3 sims/program-test/artifact.py verify --binary "$RUNNER_TEMP/$SOC/VTestDriver" \
            --soc "$SOC" --target "$RUNNER_TEMP/$SOC/program-target.json"
      - name: Exercise FESVR, boot register, MMIO, and UART
        env:
          SOC: ${{ matrix.soc }}
        run: |
          simulator="$RUNNER_TEMP/$SOC/VTestDriver"
          make -C sims smoke SOC="$SOC" PREBUILT_SIMULATOR="$simulator"
          make -C sims host-mmio-test SOC="$SOC" PREBUILT_SIMULATOR="$simulator"
          make -C sims boot-test SOC="$SOC" PREBUILT_SIMULATOR="$simulator"
          make -C sims uart-pty-test SOC="$SOC" PREBUILT_SIMULATOR="$simulator"
      - name: Verify translated NTL cache policy through SingleCoreRV5StageSoC FESVR
        if: matrix.soc == 'single-core-rv5stage-soc'
        run: make -C sims zihintntl-test SOC=single-core-rv5stage-soc PREBUILT_SIMULATOR="$RUNNER_TEMP/single-core-rv5stage-soc/VTestDriver"
      - name: Qualify RV5Stage atomics and cache-block zeroing
        if: matrix.soc == 'single-core-rv5stage-soc'
        run: |
          simulator="$RUNNER_TEMP/single-core-rv5stage-soc/VTestDriver"
          make -C sims lrsc-test SOC=single-core-rv5stage-soc PREBUILT_SIMULATOR="$simulator"
          make -C sims zicboz-test SOC=single-core-rv5stage-soc PREBUILT_SIMULATOR="$simulator"
      - name: Execute mapped MiniRV5StageSoC through standard FESVR flow
        if: matrix.soc == 'mini-rv5stage-soc'
        run: make -C vlsi/sim smoke
      - name: Prepare upstream ISA sources
        if: matrix.shape != 'single'
        run: make -C sims isa-setup
      - name: Run capability-filtered ISA smoke
        if: matrix.shape != 'single'
        env:
          SOC: ${{ matrix.soc }}
        run: |
          make -C sims isa-smoke SOC="$SOC" PROGRAM_JOBS=2 \
            PREBUILT_SIMULATOR="$RUNNER_TEMP/$SOC/VTestDriver"
      - name: Run 2-, 4-, and 8-hart benchmarks
        # Tiled Spike remains manually runnable until its full manifests fit a CI budget.
        if: matrix.soc == 'tiled-rv5stage-soc'
        env:
          SOC: ${{ matrix.soc }}
        run: |
          make -C sims tiled-mt-benchmark-test SOC="$SOC" PROGRAM_JOBS=1 \
            PREBUILT_SIMULATOR="$RUNNER_TEMP/$SOC/VTestDriver"
      - name: Package completed ISA smoke ELFs
        if: always() && matrix.shape != 'single'
        run: |
          manifest="/tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/manifest.json"
          if [[ -f "$manifest" ]]; then
            python3 sims/program-test/archive.py --manifest "$manifest" \
              --archive "$RUNNER_TEMP/isa-smoke-elfs/${{ matrix.soc }}.tar.gz"
          fi
      - name: Publish product smoke and multihart results
        if: always() && matrix.shape != 'single'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.soc }}-isa-smoke-${{ github.sha }}
          path: |
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/target.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/manifest.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/build.log
            /tmp/rhodium-program-tests/${{ matrix.soc }}/isa-smoke/results
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/manifest.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/instruction-report.json
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/build.log
            /tmp/rhodium-program-tests/${{ matrix.soc }}/mt-benchmark/*-harts/results
            ${{ runner.temp }}/isa-smoke-elfs
          if-no-files-found: warn
          retention-days: 7
      - name: Publish standalone SoC smoke ELFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.soc }}-smoke-elfs-${{ github.sha }}
          path: /tmp/rhodium-sims/${{ matrix.soc }}/*.elf
          if-no-files-found: warn
          retention-days: 7

  opensbi:
    name: SoC OpenSBI qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake device-tree-compiler lld llvm zlib1g-dev
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Install FESVR
        uses: ./.github/actions/setup-fesvr
      - name: Test OpenSBI target adapter
        run: make -C sims opensbi-adapter-test
      - name: Download exact SingleCoreRV5StageSoC simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: single-core-rv5stage-soc-${{ github.sha }}
          path: ${{ runner.temp }}/single-core-rv5stage-soc
      - name: Download exact SingleCoreSpikeSoC simulator
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: single-core-spike-soc-${{ github.sha }}
          path: ${{ runner.temp }}/single-core-spike-soc
      - name: Restore simulator executable permission
        run: |
          chmod +x "$RUNNER_TEMP/single-core-rv5stage-soc/VTestDriver"
          chmod +x "$RUNNER_TEMP/single-core-spike-soc/VTestDriver"
      - name: Initialize and qualify pinned OpenSBI on both single-core SoCs
        run: |
          make -C sims opensbi-setup
          status=0
          for soc in single-core-rv5stage-soc single-core-spike-soc; do
            make -C sims opensbi-test SOC="$soc" \
              OPENSBI_LLVM=/usr/bin \
              PREBUILT_SIMULATOR="$RUNNER_TEMP/$soc/VTestDriver" || status=1
          done
          exit "$status"
      - name: Publish OpenSBI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opensbi-${{ github.sha }}
          path: |
            /tmp/rhodium-software/single-core-rv5stage-soc/opensbi
            /tmp/rhodium-software/single-core-spike-soc/opensbi
          if-no-files-found: warn
          retention-days: 7

  tiled-memory:
    name: TiledRV5StageSoC memory backpressure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: ${{ inputs.racket-version }}
      - name: Restore exact Rhodium bytecode
        uses: ./.github/actions/setup-racket-artifact
        with:
          racket-version: ${{ inputs.racket-version }}
          rhombus-checksum: ${{ inputs.rhombus-checksum }}
          artifact-name: rhodium-bytecode-${{ github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake device-tree-compiler zlib1g-dev
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Install Verilator
        uses: ./.github/actions/setup-verilator
      - name: Install CIRCT
        uses: ./.github/actions/setup-circt
      - name: Install FESVR
        uses: ./.github/actions/setup-fesvr
      - name: Build and stress the stalled memory channel
        timeout-minutes: 35
        shell: bash
        run: make -C sims tiled-memory-test 2>&1 | tee "$RUNNER_TEMP/tiled-memory.log"
      - name: Publish memory stress diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tiled-memory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/tiled-memory.log
            /tmp/rhodium-sims/tiled-memory-test/tiled-rv5stage-soc/tiled_memory.elf
          retention-days: 7
