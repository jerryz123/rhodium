# Compiles one shared platform ELF family independently of other workload families.
# SPDX-License-Identifier: Apache-2.0

name: CI platform builds

on:
  workflow_call:
    inputs:
      build:
        description: Resolved ELF recipe for this fixed slot, or null when unused.
        required: true
        type: string
permissions:
  contents: read

jobs:
  platform-build:
    name: Build ${{ fromJSON(inputs.build).suite }} / group ${{ fromJSON(inputs.build).soc }}
    if: ${{ inputs.build != 'null' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Rhodium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up moon workspace
        uses: ./.github/actions/setup-moon
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang libgmp-dev lld llvm opam
      - name: Install RISC-V software toolchain
        uses: ./.github/actions/setup-riscv-toolchain
      - name: Build pinned litmus7 and herd7
        if: fromJSON(inputs.build).suite == 'litmus'
        env:
          HERDTOOLS7_REVISION: 7a64d9d8480ae02d9065b2778b4f2d473c6595ae
        run: |
          git clone --filter=blob:none https://github.com/herd/herdtools7.git "$RUNNER_TEMP/herdtools7"
          git -C "$RUNNER_TEMP/herdtools7" checkout "$HERDTOOLS7_REVISION"
          test "$(git -C "$RUNNER_TEMP/herdtools7" rev-parse HEAD)" = "$HERDTOOLS7_REVISION"
          opam init --bare --disable-sandboxing --yes
          opam switch create litmus ocaml-base-compiler.4.14.2 --yes
          opam install --switch=litmus --yes --deps-only "$RUNNER_TEMP/herdtools7/herdtools7.opam"
          opam exec --switch=litmus -- make -C "$RUNNER_TEMP/herdtools7" build-aslref
          opam exec --switch=litmus -- make -C "$RUNNER_TEMP/herdtools7" install-aslref PREFIX="$(opam var --switch=litmus prefix)"
          opam exec --switch=litmus -- make -C "$RUNNER_TEMP/herdtools7" build-release
          test -x "$RUNNER_TEMP/herdtools7/_build/default/litmus/litmus.exe"
          test "$("$RUNNER_TEMP/herdtools7/_build/default/litmus/litmus.exe" -version)" = '7.58+1'
          test -x "$RUNNER_TEMP/herdtools7/_build/default/herd/herd.exe"
          test "$("$RUNNER_TEMP/herdtools7/_build/default/herd/herd.exe" -version)" = "7.58+1, Rev: $HERDTOOLS7_REVISION"
          echo "LITMUS7=$RUNNER_TEMP/herdtools7/_build/default/litmus/litmus.exe" >> "$GITHUB_ENV"
          echo "LITMUS7_LIBDIR=$RUNNER_TEMP/herdtools7/litmus/libdir" >> "$GITHUB_ENV"
          echo "HERD7=$RUNNER_TEMP/herdtools7/_build/default/herd/herd.exe" >> "$GITHUB_ENV"
          echo "HERD7_LIBDIR=$RUNNER_TEMP/herdtools7/herd/libdir" >> "$GITHUB_ENV"
      - name: Prepare pinned sources
        env:
          SUITE: ${{ fromJSON(inputs.build).suite }}
        run: moon run "rhodium:$SUITE-setup"
      - name: Download generated targets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: targets-${{ github.sha }}
          path: ${{ runner.temp }}/platform-targets
      - name: Identify suite build inputs
        id: cache-inputs
        uses: ./.github/actions/product-input
        with:
          task: rhodium:hash--build--${{ fromJSON(inputs.build).suite }}
      - name: Cache platform builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/rhodium-platform-builds/${{ fromJSON(inputs.build).build_id }}/build
            /tmp/rhodium-platform-builds/${{ fromJSON(inputs.build).build_id }}/source
            /tmp/rhodium-platform-builds/${{ fromJSON(inputs.build).build_id }}/build-configuration.json
          key: "${{ runner.os }}-${{ runner.arch }}-platform-${{ fromJSON(inputs.build).build_id }}-${{ steps.cache-inputs.outputs.key }}-${{ hashFiles('.github/workflows/ci-platform-builds.yml') }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-platform-${{ fromJSON(inputs.build).build_id }}-${{ steps.cache-inputs.outputs.key }}-${{ hashFiles('.github/workflows/ci-platform-builds.yml') }}-
      - name: Build and package shared ELFs
        env:
          SOC: ${{ fromJSON(inputs.build).soc }}
          SUITE: ${{ fromJSON(inputs.build).suite }}
          BUILD_ID: ${{ fromJSON(inputs.build).build_id }}
        run: |
          export PROGRAM_TARGETS="$RUNNER_TEMP/platform-targets"
          python3 -m tools.ci.archives check-source "$BUILD_ID"
          python3 -m tools.ci.catalog
          moon run "rhodium:archive--$BUILD_ID"
          python3 -m tools.ci.archives verify "$BUILD_ID" --archive ".rhodium-cache/moon/archives/$BUILD_ID.tar.gz"
          mkdir -p "$RUNNER_TEMP/platform-elfs"
          cp ".rhodium-cache/moon/archives/$BUILD_ID.tar.gz" "$RUNNER_TEMP/platform-elfs/suite.tar.gz"
      - name: Publish shared ELFs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-elfs-${{ fromJSON(inputs.build).build_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/platform-elfs/suite.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-build-${{ fromJSON(inputs.build).build_id }}-${{ github.sha }}
          path: |
            /tmp/rhodium-platform-builds/${{ fromJSON(inputs.build).build_id }}/manifest.json
            /tmp/rhodium-platform-builds/${{ fromJSON(inputs.build).build_id }}/build.log
            /tmp/rhodium-platform-builds/${{ fromJSON(inputs.build).build_id }}/herd.log
            /tmp/rhodium-platform-builds/${{ fromJSON(inputs.build).build_id }}/build-configuration.json
          if-no-files-found: warn
          retention-days: 7
